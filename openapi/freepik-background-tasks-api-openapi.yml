            **Video constraints:**

            - Duration: 3-10 seconds

            - Resolution: 720-2160px (minimum 720px width or height)

            - Max file size: 200MB

            - Frame rate: 24-60 FPS

            - Formats: `.mp4` or `.mov` only

            '
          format: uri
