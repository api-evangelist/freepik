        image_urls:
          description: 'Reference images for style/appearance guidance.

            Reference in your prompt as @Image1, @Image2, etc.

            Maximum 4 reference images.

            '
          items:
            type: string
          type: array
        generate_audio:
          description: Whether to generate native audio for the video.
          type: boolean
        aspect_ratio:
