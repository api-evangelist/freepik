          description: 'Reference video URL. Only .mp4/.mov formats supported. Must be 1080P with duration between 3 and 8 seconds, aspect ratio 16:9 or 9:16. Max file size: 200MB.'
          type: string
      required:
      - video_url
      type: object
    kling-v3-omni-request:
      properties:
        webhook_url:
          description: 'Optional callback URL that receives asynchronous notifications when the task changes status.

            The payload includes the task status and result URL when completed.

