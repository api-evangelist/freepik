        image_url:
          description: 'URL of the start frame image for image-to-video generation.

            Required for image-to-video mode.


            **Image requirements:**

            - Minimum: 300x300 pixels

            - Maximum: 10MB file size

            - Formats: JPG, JPEG, PNG

