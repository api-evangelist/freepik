        duration:
          $ref: '#/components/schemas/kling-v3-duration'
        aspect_ratio:
          $ref: '#/components/schemas/kling-v3-omni-aspect-ratio'
        cfg_scale:
          default: 0.5
          description: 'Guidance scale controlling prompt adherence versus creative freedom. Range: 0 to 1.

            Values above 1 are not supported for Kling 3 (only Kling 1.x models support cfg_scale up to 2).


            - **0**: Maximum creative freedom, loosest interpretation of the prompt

            - **0.5** (default): Balanced between prompt adherence and creativity

            - **1**: Strongest adherence to the prompt, least creative variation

            '
          format: float
          maximum: 1
          minimum: 0
          type: number
        negative_prompt:
          default: blur, distort, and low quality
          description: Undesired elements to avoid in the generated video. Maximum 2500 characters.
          maxLength: 2500
          type: string
      required:
      - video_url
      title: Kling 3 Omni Video Reference Request
      type: object
    advanced-custom-elements-refer-video:
      properties:
