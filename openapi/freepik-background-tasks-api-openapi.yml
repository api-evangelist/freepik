  /v1/ai/text-to-video/kling-v3-turbo-720p:
    post:
      description: 'Generate AI video from a text prompt using Kling 3.0 Turbo at 720p resolution, a fast text-to-video model from the Kling 3.0 family.


        **Features:**

        - **Text-to-video**: Generate videos from detailed text prompts

        - **Resolution**: Fixed 720p output

        - **Aspect ratio**: Landscape (16:9), portrait (9:16), or square (1:1)

        - **Duration**: 3-15 seconds


        **How it works:**

        1. Submit a text prompt describing your desired video

        2. Receive a task ID to track progress

        3. Poll the status endpoint or use a `webhook_url` to get notified when the task completes

        4. Download the generated video from the result URL (valid for 30 minutes)'
      operationId: postAiTextToVideoKlingV3Turbo720p
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kling-v3-turbo-t2v-request'
        required: true
      responses:
        '200':
