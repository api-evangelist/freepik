        prompt:
          description: 'Text prompt describing the desired video content. Maximum 2500 characters.


            **Usage by mode:**

            - **Text-to-video:** Required unless multi_prompt is provided

            - **Image-to-video:** Either prompt or multi_prompt must be provided, but not both

            '
          maxLength: 2500
          type: string
        multi_prompt:
          description: 'List of prompts for multi-shot video generation. Each item is a string prompt for that shot.

            Use with shot_type to control multi-shot behavior.


            Only effective when shot_type is set. When multi_prompt is provided without an explicit shot_type, it defaults to "customize".

            '
          items:
