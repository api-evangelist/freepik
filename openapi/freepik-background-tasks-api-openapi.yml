          type: string
        start_image_url:
          description: 'Image to use as the first frame of the video.

            Use together with end_image_url to control both start and end frames in image-to-video mode.

            '
          type: string
        end_image_url:
          description: 'Image to use as the last frame of the video.

            Optional for image-to-video mode to guide the final frame.

            '
