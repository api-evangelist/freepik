openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Skin Enhancer API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: skin-enhancer
paths:
  /v1/ai/skin-enhancer/creative:
    post:
      description: Enhance skin in images using AI with the Creative mode. This mode provides more artistic and stylized enhancements.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/creative-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Skin Enhancer Creative - Enhance skin
      tags:
      - skin-enhancer
      operationId: postV1AiSkinEnhancerCreative
      x-operation-id-source: derived
  /v1/ai/skin-enhancer/faithful:
    post:
      description: Enhance skin in images using AI with the Faithful mode. This mode preserves the original appearance while improving skin quality.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/faithful-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Skin Enhancer Faithful - Enhance skin
      tags:
      - skin-enhancer
      operationId: postV1AiSkinEnhancerFaithful
      x-operation-id-source: derived
  /v1/ai/skin-enhancer/flexible:
    post:
      description: Enhance skin in images using AI with the Flexible mode. This mode allows you to choose the optimization target for the enhancement.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/flexible-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Skin Enhancer Flexible - Enhance skin
      tags:
      - skin-enhancer
      operationId: postV1AiSkinEnhancerFlexible
      x-operation-id-source: derived
  /v1/ai/skin-enhancer:
    get:
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Skin Enhancer - List tasks
      tags:
      - skin-enhancer
      operationId: getV1AiSkinEnhancer
      x-operation-id-source: derived
  /v1/ai/skin-enhancer/{task-id}:
    get:
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Skin Enhancer - Get task status
      tags:
      - skin-enhancer
      operationId: getV1AiSkinEnhancerByTaskId
      x-operation-id-source: derived
