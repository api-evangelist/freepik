    inline_object:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    change-camera-request:
      properties:
        image:
          description: 'Input image to transform. Provide as a publicly accessible HTTPS URL.

            Supported formats: JPG, PNG, WebP.

            '
          example: https://example.com/input-image.jpg
          type: string
        horizontal_angle:
          default: 0
          description: 'Horizontal rotation angle in degrees. Controls the left-right rotation of the camera around the subject.

            - `0`: Front view (no rotation)

            - `90`: Right side view

            - `180`: Back view

            - `270`: Left side view

            - `360`: Full rotation (equivalent to 0)


            Valid values: `0` to `360`. Default: `0`.

            '
          example: 45
          maximum: 360
          minimum: 0
          type: integer
        vertical_angle:
          default: 0
          description: 'Vertical tilt angle in degrees. Controls the up-down tilt of the camera relative to the subject.

            - `-30`: Looking up at the subject from below

            - `0`: Eye-level view (no tilt)

            - `45`: Moderate downward angle

            - `90`: Bird''s eye view (directly above)


            Valid values: `-30` to `90`. Default: `0`.

            '
          example: 15
          maximum: 90
          minimum: -30
          type: integer
        zoom:
          default: 5
          description: 'Zoom level controlling how close the camera appears to the subject.

            - `0`: Wide shot (far away, full scene visible)

            - `5`: Medium shot (standard framing)

            - `10`: Close-up (very close to the subject)


            Valid values: `0` to `10`. Default: `5`.

            '
          example: 5
          maximum: 10
          minimum: 0
          type: integer
        seed:
          description: 'Seed for the random number generator. Using the same seed with identical parameters produces the same output, enabling reproducible results across multiple requests.

            '
          example: 42
          minimum: 1
          type: integer
        output_format:
          $ref: '#/components/schemas/output-format_1'
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications whenever the task changes status. The payload sent to this URL is the same as the corresponding GET endpoint response, but without the data field.

            '
          example: https://www.example.com/webhook
          format: uri
          type: string
      required:
      - image
      type: object
    inline_object_3:
      example:
        message: Service Unavailable. Please try again later.
      properties:
        message:
          example: Service Unavailable. Please try again later.
          type: string
      type: object
    get_all_style_transfer_tasks_200_response:
