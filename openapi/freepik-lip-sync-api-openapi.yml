      - field
      - name
      - reason
      type: object
    request_2:
      properties:
        resolution:
          $ref: '#/components/schemas/resolution_3'
        audio_url:
          description: URL of the audio file for lip synchronization. The person in the image will speak in sync with this audio. Must be a publicly accessible URL. Supported formats include MP3, WAV, and M4A.
          example: https://example.com/speech-audio.mp3
          type: string
        image_url:
          description: URL of the portrait image to animate into a talking video. The image should contain a clearly visible face for best lip-sync results. Must be a publicly accessible URL.
          example: https://example.com/portrait.jpg
          type: string
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications whenever the task changes status. The payload sent to this URL is the same as the corresponding GET endpoint response, but without the data field.

            '
          example: https://www.example.com/webhook
          format: uri
          type: string
      required:
      - audio_url
      - image_url
      - resolution
      type: object
    task:
      example:
        task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: CREATED
      properties:
        task_id:
          description: Task identifier
          format: uuid
          type: string
        status:
          description: Task status
          enum:
          - CREATED
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          type: string
      required:
      - status
      - task_id
      type: object
    request:
      properties:
        video_url:
          description: URL of the video to sync
          example: https://example.com/input-video.mp4
          type: string
        audio_url:
          description: URL of the audio to sync
          example: https://example.com/input-audio.mp3
          type: string
        seed:
          default: 0
          description: Seed for the syncing process
          example: 42
          type: integer
        guidance_scale:
          default: 1.0
          description: Guidance strength for the sync process
          example: 1.0
          format: float
          type: number
        return_private_url:
          default: false
          description: If true, the private URL (gs URI) of the generated video will be returned
          example: false
          type: boolean
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications whenever the task changes status. The payload sent to this URL is the same as the corresponding GET endpoint response, but without the data field.

            '
          example: https://www.example.com/webhook
          format: uri
          type: string
      required:
      - audio_url
      - video_url
      type: object
    inline_object_1:
      properties:
        problem:
          $ref: '#/components/schemas/inline_object_1_problem'
      type: object
    inline_object_1_problem:
      properties:
        message:
          example: Validation error
          type: string
        invalid_params:
          items:
            $ref: '#/components/schemas/inline_object_1_problem_invalid_params_inner'
