openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Lip Sync API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: lip-sync
paths:
  /v1/ai/lip-sync/latent-sync:
    get:
      description: Get the status of all Latent-Sync lip-sync tasks
      operationId: get_all_latent_sync_tasks
      responses:
        '200':
          content:
            application/json:
              examples:
                success - return all tasks:
                  $ref: '#/components/examples/200-tasks-list'
              schema:
                $ref: '#/components/schemas/get_all_style_transfer_tasks_200_response'
          description: OK - Get the status of all Latent-Sync lip-sync tasks
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Latent Sync - List tasks
      tags:
      - lip-sync
    post:
      description: Generate lip-synced video by synchronizing a video with an audio file using AI Latent-Sync technology
      operationId: create_latent_sync_lip_sync
      requestBody:
        content:
          application/json:
            examples:
              all-params:
                $ref: '#/components/examples/request-latent-sync-all-params'
              required-params:
                $ref: '#/components/examples/request-latent-sync-required-params'
            schema:
              $ref: '#/components/schemas/request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Latent Sync - Lip-sync video generation
      tags:
      - lip-sync
  /v1/ai/lip-sync/latent-sync/{task-id}:
    get:
      description: Get the status of one Latent-Sync lip-sync task
      operationId: get_latent_sync_task_status
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                success - completed task:
                  $ref: '#/components/examples/200-latent-sync-task-completed'
                success - in progress task:
                  $ref: '#/components/examples/200-task-in-progress'
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The task exists and the status is returned
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Latent Sync - Get task status
      tags:
      - lip-sync
  /v1/ai/lip-sync/veed-fabric-1-0:
    get:
      description: Retrieve all Veed Fabric 1.0 lip-sync tasks for the authenticated user.
      operationId: get_all_veed_fabric_1_0_tasks
      responses:
        '200':
          content:
            application/json:
              examples:
                success - return all tasks:
                  $ref: '#/components/examples/200-tasks-list'
              schema:
                $ref: '#/components/schemas/get_all_style_transfer_tasks_200_response'
          description: OK - List of Veed Fabric 1.0 tasks
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Veed Fabric 1.0 - List tasks
      tags:
      - lip-sync
    post:
      description: 'Generate a realistic talking video by combining a static portrait image with an audio file using Veed Fabric 1.0.

        The model produces a lip-synced video (MP4) where the person in the image speaks naturally in sync with the provided audio.

        Ideal for creating talking head videos from a single photo and voice recording.'
      operationId: create_veed_fabric_1_0_lip_sync
      requestBody:
        content:
          application/json:
            examples:
              all-params:
                $ref: '#/components/examples/request-veed-fabric-1-0-all-params'
              required-params:
                $ref: '#/components/examples/request-veed-fabric-1-0-required-params'
            schema:
              $ref: '#/components/schemas/request_1'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Veed Fabric 1.0 - Generate talking video
      tags:
      - lip-sync
  /v1/ai/lip-sync/veed-fabric-1-0/{task-id}:
    get:
      description: Retrieve a specific Veed Fabric 1.0 lip-sync task by its ID, including generation status and result URL when completed.
      operationId: get_veed_fabric_1_0_task_status
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                success - completed task:
                  $ref: '#/components/examples/200-veed-fabric-1-0-task-completed'
                success - in progress task:
                  $ref: '#/components/examples/200-task-in-progress'
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The task exists and the status is returned
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Veed Fabric 1.0 - Get task status
      tags:
      - lip-sync
  /v1/ai/lip-sync/veed-fabric-1-0-fast:
    get:
      description: Retrieve all Veed Fabric 1.0 Fast lip-sync tasks for the authenticated user.
      operationId: get_all_veed_fabric_1_0_fast_tasks
      responses:
        '200':
          content:
            application/json:
              examples:
                success - return all tasks:
                  $ref: '#/components/examples/200-tasks-list'
              schema:
                $ref: '#/components/schemas/get_all_style_transfer_tasks_200_response'
          description: OK - List of Veed Fabric 1.0 Fast tasks
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Veed Fabric 1.0 Fast - List tasks
      tags:
      - lip-sync
    post:
      description: 'Generate a realistic talking video by combining a static portrait image with an audio file using Veed Fabric 1.0 Fast.

        This is the faster variant of Veed Fabric 1.0, optimized for reduced generation time while maintaining quality lip synchronization.

        Ideal for workflows requiring quick turnaround on talking head video generation.'
      operationId: create_veed_fabric_1_0_fast_lip_sync
      requestBody:
        content:
          application/json:
            examples:
              all-params:
                $ref: '#/components/examples/request-veed-fabric-1-0-fast-all-params'
              required-params:
                $ref: '#/components/examples/request-veed-fabric-1-0-fast-required-params'
            schema:
              $ref: '#/components/schemas/request_2'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Veed Fabric 1.0 Fast - Generate talking video
      tags:
      - lip-sync
  /v1/ai/lip-sync/veed-fabric-1-0-fast/{task-id}:
    get:
      description: Retrieve a specific Veed Fabric 1.0 Fast lip-sync task by its ID, including generation status and result URL when completed.
      operationId: get_veed_fabric_1_0_fast_task_status
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                success - completed task:
                  $ref: '#/components/examples/200-veed-fabric-1-0-fast-task-completed'
                success - in progress task:
                  $ref: '#/components/examples/200-task-in-progress'
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The task exists and the status is returned
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Veed Fabric 1.0 Fast - Get task status
      tags:
      - lip-sync
