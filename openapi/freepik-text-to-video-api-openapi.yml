components:
  schemas:
    aspect-ratio_1:
      default: 969
      description: 'Output video aspect ratio:

        - `16:9`: Landscape (widescreen)

        - `9:16`: Portrait (vertical, mobile-optimized)

        - `1:1`: Square

        - `4:3`: Standard landscape

        - `3:4`: Standard portrait

        - `21:9`: Ultra-wide cinematic

