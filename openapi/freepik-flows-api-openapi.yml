      properties:
        run_id:
          description: Unique identifier (SQID) for this execution run. Matches the `workflow_run_identifier` returned by the run endpoint.
          example: omps2OH829
          type: string
        status:
          $ref: '#/components/schemas/run-status'
        app_id:
          description: SQID of the flow that was executed. (Field name retained from the underlying execution payload.)
          example: uqzQLDr2Aw
          type: string
        started_at:
          description: ISO 8601 timestamp when execution started. Null while the run is pending.
          example: 2026-02-25 12:00:00+00:00
          format: date-time
          type:
          - string
          - 'null'
        completed_at:
          description: ISO 8601 timestamp when execution completed. Null while the run is still in progress.
          example: 2026-02-25 12:02:00+00:00
          format: date-time
          type:
          - string
          - 'null'
        error_message:
          description: Error details when the execution fails or completes with errors. Null on success.
          type:
          - string
          - 'null'
          example: null
        result:
