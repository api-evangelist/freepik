openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Flows API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: Flows
paths:
  /v1/ai/flows:
    get:
      description: 'Returns all flows **published as tools** that the authenticated user can execute.

        Each item includes the flow identifier, name, and tool metadata.


        Flows are visual AI pipelines built in Magnific Spaces.

        Each flow chains together multiple AI tools (upscale, generate, edit, etc.) and can be executed via API.


        **Use this endpoint to discover** runnable flows, then call the detail endpoint to get input definitions before running them.'
      operationId: list_flows
      parameters:
      - description: Filter flows by name (case-insensitive substring match).
        example: cartoon
        in: query
        name: search
        required: false
        schema:
          maxLength: 200
          type: string
      responses:
        '200':
          $ref: '#/components/responses/list-200-response'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Flows - List flows
      tags:
      - Flows
  /v1/ai/flows/{flow-id}:
    get:
      description: 'Returns the full definition of a flow, including its dynamic inputs and cost.


        **Inputs** define what values the caller must provide when running the flow:

        - `creation` type: accepts an image/media URL, base64-encoded data, or an existing creation identifier

        - `text` type: accepts a plain text string (prompt, label, etc.)

        - `number` type: accepts a numeric value

        - `select` type: accepts a value from predefined options


        Use each input''s `api_key` field (recommended, human-friendly node name) as the identifier when calling the run endpoint.

        The UUID-based `id` field is still accepted for backward compatibility.

        The `tool_metadata.total_cost` field indicates the credit cost per execution.'
      operationId: get_flow
      parameters:
      - description: Short unique identifier (sqid) of the flow. Discover flow identifiers via GET /v1/ai/flows.
        in: path
        name: flow-id
        required: true
        schema:
          example: uqzQLDr2Aw
          type: string
      responses:
        '200':
          $ref: '#/components/responses/detail-200-response'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          description: Flow not found.
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Flows - Get flow definition
      tags:
      - Flows
  /v1/ai/flows/{flow-id}/run:
    post:
      description: 'Triggers the execution of a flow. Provide values for all required inputs

        defined in the flow''s definition (see the GET endpoint).


        The `inputs` object maps each input''s `api_key` (recommended) or its `id` (UUID, legacy) to its value:


        | Input Type | Accepted Values |

        |------------|----------------|

        | `creation` | Image URL (`https://...`), base64-encoded image string, or existing creation identifier |

        | `text` | Plain text string |

        | `number` | Numeric value |

        | `select` | Value from allowed options |


        **This endpoint is asynchronous.** It returns immediately with `status: "running"` and a

        `workflow_run_identifier`. Provide a `webhook` URL to receive notifications when the execution

        completes. The webhook receives two events: `initialized` (run started) and `finished`/`failed` (run completed).


        The webhook payload for a completed run includes a `result` object containing `images`, `videos`,

        and `audios` arrays with download URLs for the generated assets.'
      operationId: run_flow
      parameters:
      - description: Short unique identifier (sqid) of the flow to execute. Discover flow identifiers via GET /v1/ai/flows.
        in: path
        name: flow-id
        required: true
        schema:
          example: uqzQLDr2Aw
          type: string
      requestBody:
        content:
          application/json:
            example:
              inputs:
                image: car in the forest
              webhook: https://www.example.com/webhook
            schema:
              $ref: '#/components/schemas/run-request'
        required: true
      responses:
        '202':
          $ref: '#/components/responses/run-202-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          description: Flow not found.
        '422':
          description: Validation error on input values.
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Flows - Run a flow
      tags:
      - Flows
  /v1/ai/flows/runs/{run-id}:
    get:
      description: 'Retrieve the current status and results of a flow execution run.


        Use this endpoint to **poll** the status of a run after calling the

        `POST /v1/ai/flows/{flow-id}/run` endpoint. The `run_id` path parameter

        corresponds to the `workflow_run_identifier` returned in the run response.


        **Polling strategy:**

        - Wait 2-3 seconds after starting the run before the first poll

        - Poll every 3-5 seconds

        - When `status` is `completed`, the `result` field contains download URLs

        - When `status` is `failed`, the `error_message` field describes the failure


        **Asset URLs** in the `result` field are temporary and valid for **12 hours**.


        **Statuses:**

        | Status | Description |

        |--------|-------------|

        | `pending` | Run is queued but has not started yet |

        | `running` | Flow is executing |

        | `completed` | Finished successfully, `result` is available |

        | `completed_with_errors` | Execution finished but some nodes failed |

        | `failed` | Execution failed, see `error_message` |

        | `cancelled` | Execution was cancelled |'
      operationId: get_flow_run
      parameters:
      - description: 'Unique identifier (SQID) of the flow run. This is the

          `workflow_run_identifier` value returned by the `POST /v1/ai/flows/{flow-id}/run` endpoint.

          '
        in: path
        name: run-id
        required: true
        schema:
          example: omps2OH829
          type: string
      responses:
        '200':
          $ref: '#/components/responses/run-detail-200-response'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Flows - Get run status
      tags:
      - Flows
  /v1/ai/me/flows:
    get:
      description: 'Returns all flows **owned** by the authenticated user, including drafts and unpublished workflows.


        Unlike `GET /v1/ai/flows` which returns only flows published as tools, this endpoint returns

        every flow the user has created — regardless of whether it has been published as a tool.


        Each item includes the flow identifier and name.'
      operationId: list_my_flows
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-list-my-flows'
              schema:
                $ref: '#/components/schemas/list_my_flows_200_response'
          description: OK - List of user's flows.
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Flows - List my flows
      tags:
      - Flows
components:
  schemas:
    input-definition:
      description: 'Defines a single input parameter for the flow.

        Use the `api_key` field (recommended) or the `id` field (legacy) as the identifier in the `inputs` object when calling the run endpoint.

        '
      example:
        id: input-4050c3f3-8a26-4953-97a8-cb97bceb4816-1
        api_key: text_prompt
        key: text_prompt
        type: text
        label: 'Text #1'
        config: null
        nodeId: 4050c3f3-8a26-4953-97a8-cb97bceb4816
        default: null
        required: true
        presentation:
          mode: textarea
          type: text
      properties:
        id:
          description: 'UUID-based identifier for this input. Format: `input-{nodeId}-{n}`.

            Still accepted as a key in the `inputs` object for backward compatibility; prefer `api_key`.

            '
          example: input-4050c3f3-8a26-4953-97a8-cb97bceb4816-1
          type: string
        api_key:
          description: 'Human-friendly identifier for this input, matching the node name.

            Recommended identifier to use as the key in the `inputs` object when running the flow.

            '
          example: text_prompt
          type: string
        key:
          deprecated: true
          description: '(Deprecated) Legacy human-readable key. Superseded by `api_key`; may be absent in newer responses. Prefer `api_key`.

            '
          example: text_prompt
          type: string
        type:
          description: 'The type of input value expected:

            - `creation`: Image or media file (accepts URL, base64, or creation sqid)

            - `text`: Text prompt or string

            - `number`: Numeric value

            - `select`: Choice from predefined options

            '
          enum:
          - creation
          - text
          - number
          - select
          example: text
          type: string
        label:
          description: Human-readable label for display.
          example: 'Text #1'
          type: string
        config:
          $ref: '#/components/schemas/input_definition_config'
        nodeId:
          description: UUID of the flow node this input feeds into.
          example: 4050c3f3-8a26-4953-97a8-cb97bceb4816
          format: uuid
          type: string
        default:
          description: Default value if not provided by the caller. Null means no default.
        required:
          description: Whether this input must be provided when running the flow.
          example: true
          type: boolean
        presentation:
          $ref: '#/components/schemas/input_definition_presentation'
      required:
      - id
      - key
      - required
      - type
      type: object
    list_my_flows_200_response_data_inner:
      example:
        name: My Custom Sketch to Image
        sqid: uqzQLDr2Aw
      properties:
        sqid:
          description: Short unique identifier of the flow.
          example: uqzQLDr2Aw
          type: string
        name:
          description: Human-readable name of the flow.
          example: My Custom Sketch to Image
          type: string
      type: object
    inline_object_1_problem_invalid_params_inner:
      properties:
        name:
          description: Name of the invalid parameter.
          example: page
          type: string
        field:
          description: Field of the invalid parameter. Mirrors `name`.
          example: page
          type: string
        reason:
          example: Parameter 'page' must be greater than 0
          type: string
      required:
      - field
      - name
      - reason
      type: object
    input_definition_presentation:
      description: 'UI presentation hints for rendering the input.

        Present for `text` type inputs; null or absent for other types.

        '
      properties:
        mode:
          description: The UI control mode (e.g. `textarea`, `input`).
          example: textarea
          type: string
        type:
          description: The presentation type.
          example: text
          type: string
      type:
      - object
      - 'null'
    run_detail_result:
      description: 'Execution output. Contains arrays of generated assets grouped by media type.

        Null while the run is still in progress or if the execution failed.


        Asset URLs are **temporary** and valid for 12 hours.

        '
      example:
        images:
        - duration: 0.8008281904610115
          width: 6
