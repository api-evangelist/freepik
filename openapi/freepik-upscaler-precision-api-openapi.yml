openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Upscaler Precision API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: upscaler-precision
paths:
  /v1/ai/image-upscaler-precision:
    get:
      description: Returns a list of all precision upscaler tasks. Each task includes its ID, current status, and output URL if completed.
      operationId: getAiImageUpscalerPrecisionTasks
      responses:
        '200':
          content:
            application/json:
              examples:
                success - return all tasks:
                  $ref: '#/components/examples/200-tasks-list'
              schema:
                $ref: '#/components/schemas/get_all_style_transfer_tasks_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Upscaler Precision - List tasks
      tags:
      - upscaler-precision
    post:
      description: 'Upscales an image while adding new visual elements or details.

        This endpoint may modify the original image content based on the prompt and inferred context.'
      operationId: postAiImageUpscalerPrecision
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/request-content_2'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Upscaler Precision - Upscale image
      tags:
      - upscaler-precision
  /v1/ai/image-upscaler-precision/{task-id}:
    get:
      description: Returns the current status and output URL of a specific precision upscaler task. The output URL is included only if the task has completed successfully.
      operationId: getAiImageUpscalerPrecisionTask
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                success - completed task:
                  $ref: '#/components/examples/200-task-completed'
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The task exists and the status is returned
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Upscaler Precision - Get task status
      tags:
      - upscaler-precision
  /v1/ai/image-upscaler-precision-v2:
    get:
      description: Returns a list of all precision upscaler V2 tasks. Each task includes its ID, current status, and output URL if completed.
      operationId: getAiImageUpscalerPrecisionV2Tasks
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Upscaler Precision V2 - List tasks
      tags:
      - upscaler-precision
    post:
      description: 'Upscales an image while adding new visual elements or details (V2).

        This endpoint may modify the original image content based on the prompt and inferred context.'
      operationId: postAiImageUpscalerPrecisionV2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/request-content_3'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Upscaler Precision V2 - Upscale image
      tags:
      - upscaler-precision
  /v1/ai/image-upscaler-precision-v2/{task-id}:
    get:
      description: Returns the current status and output URL of a specific precision upscaler V2 task. The output URL is included only if the task has completed successfully.
      operationId: getAiImageUpscalerPrecisionV2Task
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Upscaler Precision V2 - Get task status
      tags:
      - upscaler-precision
