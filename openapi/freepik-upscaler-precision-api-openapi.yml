          description: Task status
          enum:
          - CREATED
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          type: string
      required:
      - status
      - task_id
      type: object
    flavor:
      description: 'Image processing flavor that determines the upscaling style and optimization for different image types:

        - `sublime`: Optimized for artistic and illustrated images with smooth gradients and vibrant colors

        - `photo`: Optimized for photographic images, preserving natural colors and realistic details

        - `photo_denoiser`: Specialized for photos with noise reduction, ideal for low-light or grainy photographs

        '
      enum:
      - sublime
      - photo
      - photo_denoiser
      type: string
    inline_object_1:
      properties:
        problem:
          $ref: '#/components/schemas/inline_object_1_problem'
      type: object
    inline_object_1_problem:
      properties:
        message:
          example: Validation error
          type: string
        invalid_params:
          items:
            $ref: '#/components/schemas/inline_object_1_problem_invalid_params_inner'
          type: array
      required:
      - invalid_params
      - message
      type: object
    inline_object_2:
      example:
        message: Internal Server Error
      properties:
        message:
          example: Internal Server Error
          type: string
      type: object
    inline_object:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    request_content_3_scale_factor:
      description: 'Image scaling factor for upscaling. Determines how much larger the output image will be compared to the input.

        For example, a scale ratio of 2 will double the dimensions (2x width and 2x height, resulting in 4x total pixels).

        Valid values range from 2 to 16. Can be provided as an integer or string.

        '
      oneOf:
      - maximum: 16
        minimum: 2
        type: integer
      - pattern: ^(2|3|4|5|6|7|8|9|1[0-6])$
        type: string
    get_style_transfer_task_status_200_response:
      example:
        data:
          generated:
          - https://openapi-generator.tech
          - https://openapi-generator.tech
          task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: CREATED
      properties:
        data:
          $ref: '#/components/schemas/task-detail'
      required:
      - data
      type: object
    inline_object_3:
      example:
        message: Service Unavailable. Please try again later.
      properties:
        message:
          example: Service Unavailable. Please try again later.
          type: string
      type: object
    request-content_2:
      properties:
        image:
          description: Base64 image to upscale
          format: byte
          type: string
        webhook_url:
          description: Webhook URL
          format: uri
          type: string
        sharpen:
          default: 50
          description: Sharpen the image
          maximum: 100
          minimum: 0
          type: integer
        smart_grain:
          default: 7
          description: Smart grain
          maximum: 100
          minimum: 0
          type: integer
        ultra_detail:
          default: 30
          description: Ultra detail
          maximum: 100
          minimum: 0
          type: integer
        filter_nsfw:
          default: false
          description: Enable NSFW content filtering on the output image
          type: boolean
      required:
      - image
      type: object
    get_all_style_transfer_tasks_200_response:
      example:
        data:
        - task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: CREATED
        - task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: CREATED
      properties:
        data:
          items:
            $ref: '#/components/schemas/task'
          type: array
      required:
      - data
      type: object
    request-content_3:
      properties:
        image:
          description: 'Source image to upscale. Accepts either:

            - A publicly accessible HTTPS URL pointing to the image

            - A base64-encoded image string


            This image will be enhanced with AI-powered upscaling technology that intelligently adds details and improves image quality while increasing resolution.

            '
          type: string
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications when the upscaling task completes.

            The webhook will be called with the task status and the upscaled image URL.

            '
          format: uri
          type: string
        sharpen:
          default: 7
          description: 'Image sharpness intensity control. Higher values increase edge definition and clarity in the upscaled image.

            Valid values range from 0 (no sharpening) to 100 (maximum sharpness). Default is 7.

            '
          maximum: 100
          minimum: 0
          type: integer
        smart_grain:
          default: 7
          description: 'Intelligent grain/texture enhancement for the upscaled image. Helps preserve natural film grain and texture detail.

            Higher values add more fine-grained texture to prevent the upscaled image from looking too smooth or artificial.

            Valid values range from 0 (no grain) to 100 (maximum grain). Default is 7.

            '
          maximum: 100
          minimum: 0
          type: integer
        ultra_detail:
          default: 30
          description: 'Ultra detail enhancement level for the image upscaling process. This parameter controls how much fine detail

            the AI adds to the upscaled image, such as textures, patterns, and micro-details.

            Higher values create more intricate details. Valid values range from 0 to 100. Default is 30.

            '
          maximum: 100
          minimum: 0
          type: integer
        flavor:
          $ref: '#/components/schemas/flavor'
        scale_factor:
          $ref: '#/components/schemas/request_content_3_scale_factor'
        filter_nsfw:
          default: false
          description: Enable NSFW content filtering on the output image
          type: boolean
      required:
      - image
      type: object
    task-detail:
      allOf:
      - $ref: '#/components/schemas/task'
      - properties:
          generated:
            items:
              description: URL of the generated image
              format: uri
              type: string
            type: array
        required:
        - generated
        type: object
      example:
        generated:
        - https://openapi-generator.tech
        - https://openapi-generator.tech
        task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: CREATED
    task-detail_1:
      allOf:
      - $ref: '#/components/schemas/task'
      - properties:
          generated:
            items:
              description: URL of the generated image
              format: uri
              type: string
            type: array
        required:
        - generated
        type: object
      example:
        generated:
        - https://openapi-generator.tech
        - https://openapi-generator.tech
        task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: CREATED
  responses:
