openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Kling V3 Turbo T2v 720p API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: kling-v3-turbo-t2v-720p
paths:
  /v1/ai/text-to-video/kling-v3-turbo-720p:
    post:
      description: 'Generate AI video from a text prompt using Kling 3.0 Turbo at 720p resolution, a fast text-to-video model from the Kling 3.0 family.


        **Features:**

        - **Text-to-video**: Generate videos from detailed text prompts

        - **Resolution**: Fixed 720p output

        - **Aspect ratio**: Landscape (16:9), portrait (9:16), or square (1:1)

        - **Duration**: 3-15 seconds


        **How it works:**

        1. Submit a text prompt describing your desired video

        2. Receive a task ID to track progress

        3. Poll the status endpoint or use a `webhook_url` to get notified when the task completes

        4. Download the generated video from the result URL (valid for 30 minutes)'
      operationId: postAiTextToVideoKlingV3Turbo720p
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kling-v3-turbo-t2v-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task-detail-200-default-response'
          description: OK - Task created successfully
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Kling 3.0 Turbo T2V 720p - Generate video
      tags:
      - kling-v3-turbo-t2v-720p
