openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Icons API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: Icons
paths:
  /v1/icons:
    get:
      description: Get a list of icons based on the provided parameters and ordering criteria.
      operationId: search_icons
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Search term. If only term comes, it is searched for term, if only slug comes, it is searched for slug and if both come, it is searched for slug
        example: nature
        in: query
        name: term
        required: false
        schema:
          type: string
      - description: Search by slug
        example: dog
        in: query
        name: slug
        required: false
        schema:
          type: string
      - description: Page number. It must be greater than 0.
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Results per page. It must be greater than 0.
        example: 100
        in: query
        name: per_page
        schema:
          type: integer
      - description: Icon family id.
        example: 30955
        in: query
        name: family-id
        required: false
        schema:
          minimum: 1
          type: integer
      - description: 'Define order of results.

          - Note: If the term or slug parameter is used, the order will be the similarity of the search.

          '
        example: relevance
        in: query
        name: order
        required: false
        schema:
          default: relevance
          enum:
          - relevance
          - recent
          type: string
      - description: "Size of the thumbnail. \nIf the size is not specified, the API will return 128 as a default size.\n"
        example: 128, 512
        in: query
        name: thumbnail_size
        required: false
        schema:
          type: string
      - description: Filter parameters for icons
        explode: true
        in: query
        name: filters
        schema:
          $ref: '#/components/schemas/search_icons_filters_parameter'
        style: deepObject
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search_icons_200_response'
          description: OK Response
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-not-found'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Search and filter icons by specified order
      tags:
      - Icons
  /v1/icons/{id}:
    get:
      description: Get detailed information about a specific icon identified by its unique ID.
      operationId: get_icon_detail_by_id
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Icon resource ID
        example: 30955
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                example-0:
                  $ref: '#/components/examples/200-icon-detail'
              schema:
                $ref: '#/components/schemas/get_icon_detail_by_id_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-not-found'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Get detailed icon information by ID
      tags:
      - Icons
  /v1/icons/{id}/download:
    get:
      description: Download the specified icon by its unique ID in the requested format and size.
      operationId: download_icon_by_id
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Icon resource ID
        example: 30955
        in: path
        name: id
        required: true
        schema:
          type: integer
      - description: 'These are the formats available for download

          - Note: gif, mp4, aep, json, psd and eps are not available for standard and sticker icon types.

          '
        example: svg
        in: query
        name: format
        schema:
          enum:
          - svg
          - png
          - gif
          - mp4
          - aep
          - json
          - psd
          - eps
          type: string
      - description: 'These are the sizes available for png_url formats.

          - Note: Only apply to format png.

          '
        in: query
        name: png_size
        schema:
          default: 512
          enum:
          - 512
          - 256
          - 128
          - 64
          - 32
          - 24
          - 16
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/data-icon-download'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Download an icon
      tags:
      - Icons
components:
  responses:
    401-unauthorized:
      content:
        application/json:
          examples:
            invalid_api_key:
              summary: API key is not valid
              value:
                message: Invalid API key
            missing_api_key:
              summary: API key is not provided
              value:
                message: Missing API key
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Unauthorized - The client must authenticate itself to get the requested response.
    403-forbidden:
      content:
        application/json:
          examples:
            user_not_authorized:
              summary: User has not privileges to access some resource
              value:
                message: User is not authorized to access this resource
            user_not_owner:
              summary: Collection author id is different from current user's id
              value:
                message: User is not owner of requested collection
            item_is_premium:
              summary: The user cannot download this item because it is premium
              value:
                message: The user cannot download this item because it is premium
            creator_not_authorized:
              summary: Creator has not privileges to access some resource
              value:
                message: Creator is not authorized to access this resource
            transaction_stats_access_denied:
              summary: Group admin is not allowed to access the requested transaction stats
              value:
                message: Access denied to transaction stats for the current role
            credit_filter_not_allowed:
              summary: Group admin tried to use a credit-usage filter dimension not allowed for their role
              value:
                message: Credit filter not allowed for the current role
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Forbidden - The client does not have permission to access the requested resource.
    400-bad-request:
      content:
        application/json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Parameter 'page' must be greater than 0
            invalid_query:
              summary: Parameter 'query' is not valid
              value:
                message: Parameter 'query' must not be empty
            invalid_filter:
              summary: Parameter 'filter' is not valid
              value:
                message: Parameter 'filter' is not valid
            generic_bad_request:
              summary: Bad Request
              value:
                message: Parameter ':attribute' is not valid
          schema:
            $ref: '#/components/schemas/inline_object'
        application/problem+json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Validation error
                invalid_params:
                - field: page
                  reason: Parameter 'page' must be greater than 0
                - field: per_page
                  reason: Parameter 'per_page' must be greater than 0
          schema:
            $ref: '#/components/schemas/inline_object_1'
      description: Bad Request - The server could not understand the request due to invalid syntax.
    404-not-found:
      content:
        application/json:
          examples:
            ai_resource_not_found:
              summary: AI resource with provided id does not exist
              value:
                message: AI resource not found
            collection_not_found:
              summary: Collection with provided id does not exist
              value:
                message: Collection not found
            resource_not_found:
              summary: Resource with provided id does not exist
              value:
                message: Resource not found
            resources_not_found:
              summary: Resources not found
              value:
                message: Resources not found
            user_not_found:
              summary: User with provided id does not exist
              value:
                message: User not found
            video_not_found:
              summary: Video with provided id does not exist
              value:
                message: Video not found
            video_assets_not_found:
              summary: Video with provided id has not associated assets
              value:
                message: Video not found
            icon_not_found:
              summary: Icon with provided id does not exist
              value:
                message: Icon not found
            author_not_found:
              summary: Author with provided id does not exist
              value:
                message: Author not found
            developer_not_found:
              summary: Developer with provided email does not exist
              value:
                message: Developer not found
            country_not_found:
              summary: Country with provided code does not exist
              value:
                message: Country not found
            generic_not_found:
              summary: Not Found
              value:
                message: Not found
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Not Found - The server can not find the requested resource.
    500-internal-server-error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_2'
      description: Internal Server Error - The server has encountered a situation it doesn't know how to handle.
    429-too-many-requests:
      content:
        application/json:
          examples:
            generic:
              summary: Generic message for 429 errors
              value:
                message: Too many requests
            download_limit_reached:
              summary: The download limits has been reached.
              value:
                message: The user can't download more items because the download limits has been reached.
            edit_limit_reached:
              summary: Free user icon edit limits has been reached.
              value:
                message: Limit for free users reached.
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Too Many Requests - The client has sent too many requests in a given amount of time.
  schemas:
    inline_object_1_problem_invalid_params_inner:
      properties:
        name:
          description: Name of the invalid parameter.
          example: page
          type: string
        field:
          description: Field of the invalid parameter. Mirrors `name`.
          example: page
          type: string
        reason:
          example: Parameter 'page' must be greater than 0
          type: string
      required:
      - field
      - name
      - reason
      type: object
    search_icons_filters_parameter:
      properties:
        color:
          description: Filter by color.
          enum:
          - gradient
          - solid-black
          - multicolor
          - azure
          - black
          - blue
          - chartreuse
          - cyan
          - gray
          - green
          - orange
          - red
          - rose
          - spring-green
          - violet
          - white
          - yellow
          example: red
          type: string
        shape:
          description: Filter by shape.
          enum:
          - outline
          - fill
          - lineal-color
          - hand-drawn
          example: outline
          type: string
        period:
          default: all
          description: Filter by period.
          enum:
          - three-months
          - six-months
          - one-year
          - all
          example: all
          type: string
        free_svg:
          default: all
          description: Filter by free svg, for free or premium item or all for both
          enum:
          - all
          - free
          - premium
          example: free
          type: string
        icon_type:
          description: Filter of available icon types.
          example:
          - standard
          - sticker
          items:
            enum:
            - standard
            - animated
            - sticker
            - uicon
            type: string
          type: array
      type: object
    author:
      example:
        assets: 0
        name: John Doe
        id: 2147483647
        avatar: https://avatar.cdnpk.net/61668527-220726032514.jpg
        slug: merry-christmas
      properties:
        id:
          maximum: 9223372036854775807
          minimum: 1
          type: integer
        name:
          example: John Doe
          minLength: 1
          type: string
        avatar:
          example: https://avatar.cdnpk.net/61668527-220726032514.jpg
          format: uri
          type: string
        assets:
          description: The number of assets of this author.
          minimum: 0
          type: integer
        slug:
          example: merry-christmas
          minLength: 1
          type: string
      required:
      - assets
      - avatar
      - id
      - name
      - slug
      type: object
    source:
      example:
        width: 512
        url: https://v4.cdnpk.net/videvo_files/video/free/video0485/thumbnails/_import_61a866e2519c71.61070863_large.png
        height: 512
      properties:
        url:
          example: https://v4.cdnpk.net/videvo_files/video/free/video0485/thumbnails/_import_61a866e2519c71.61070863_large.png
          format: uri
          type: string
        width:
          example: 512
          type: integer
        height:
          example: 512
          type: integer
      type: object
    pagination:
      description: Metainformation about pagination
      example:
        per_page: 1
        total: 1
        last_page: 1
        current_page: 1
      properties:
        current_page:
          description: The current page.
          example: 1
          type: integer
        per_page:
          description: The limit of resources per page.
          example: 1
          type: integer
        last_page:
          description: The total number of pages.
          example: 1
          type: integer
        total:
          description: The total number of resources.
          example: 1
          type: integer
      type: object
    data_icon_download_data:
      example:
        filename: filename
        url: https://openapi-generator.tech
      properties:
        filename:
          type: string
        url:
          format: uri
          type: string
      type: object
    inline_object_1:
      properties:
        problem:
          $ref: '#/components/schemas/inline_object_1_problem'
      type: object
    data-icon-download:
      example:
        data:
          filename: filename
          url: https://openapi-generator.tech
      properties:
        data:
          $ref: '#/components/schemas/data_icon_download_data'
      type: object
    inline_object_1_problem:
      properties:
        message:
          example: Validation error
          type: string
        invalid_params:
          items:
            $ref: '#/components/schemas/inline_object_1_problem_invalid_params_inner'
          type: array
      required:
      - invalid_params
      - message
      type: object
    inline_object_2:
      example:
        message: Internal Server Error
      properties:
        message:
          example: Internal Server Error
          type: string
      type: object
    inline_object:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
