openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Loras API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: loras
paths:
  /v1/ai/loras:
    get:
      operationId: get_available_loras_list
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-loras'
              schema:
                $ref: '#/components/schemas/get_available_loras_list_200_response'
          description: OK
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      tags:
      - loras
      summary: Get available loras list
      x-summary-source: derived
  /v1/ai/loras/styles:
    post:
      description: 'Create you own custom style using LoRAs training


        For now you can check the status of the training calling `v1/ai/loras`. We are working on it'
      requestBody:
        content:
          application/json:
            examples:
              characters-request:
                $ref: '#/components/examples/request-loras-styles'
            schema:
              $ref: '#/components/schemas/loras-style-request'
      responses:
        '200':
          content:
            application/json:
              examples:
                success - in progress task:
                  $ref: '#/components/examples/200-task-in-progress'
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The request has succeeded and the style is processing
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Mystic LoRA Styles - Train custom style
      tags:
      - loras
      operationId: postV1AiLorasStyles
      x-operation-id-source: derived
  /v1/ai/loras/characters:
    post:
      description: 'Create you own custom character using LoRAs training


        For now you can check the status of the training calling `v1/ai/loras`. We are working on it'
      requestBody:
        content:
          application/json:
            examples:
              characters-request:
                $ref: '#/components/examples/request-loras-characters'
            schema:
              $ref: '#/components/schemas/loras-character-request'
      responses:
        '200':
          content:
            application/json:
              examples:
                success - in progress task:
                  $ref: '#/components/examples/200-task-in-progress'
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The request has succeeded and the character is processing
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: LoRAs training for custom characters
      tags:
      - loras
      operationId: postV1AiLorasCharacters
      x-operation-id-source: derived
components:
  examples:
    request-loras-styles:
      summary: Request - LoRAs styles training
      value:
        name: my-awesome-style
        description: string
        quality: high
        images:
        - string
        - string
        - string
        - string
        - string
        - string
        - string
        - string
        webhook_url: https://my-webhook-url.com/endpoint
    200-task-in-progress:
      summary: Success - Task in progress
      value:
        data:
          generated: []
          task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          status: IN_PROGRESS
    request-loras-characters:
      summary: Request - LoRAs characters training
      value:
        name: my-awesome-character
        description: string
        quality: high
        gender: male
        images:
        - string
        - string
        - string
        - string
        - string
        - string
        - string
        - string
        webhook_url: https://my-webhook-url.com/endpoint
    200-loras:
      summary: Loras response
      value:
        data:
          default:
          - id: 1
            name: vintage-japanese
            description: Expect bold red colors and a sense of nostalgia, bringing to life classic Japanese elements.
            category: illustration
            type: style
            preview: https://example.com/vintage-japanese-preview.jpg
            training:
              status: completed
              defaultScale: 1.2
          - id: 2
            name: sara
            description: sara
            category: people
            type: character
            preview: https://example.com/sara-preview.jpg
            training:
              status: completed
              defaultScale: 1.2
          - id: 3
            name: glasses
            description: glasses
            category: glasses
            type: product
            preview: https://example.com/glasses-preview.jpg
            training:
              status: completed
              defaultScale: 1.2
          customs:
          - id: 110
            name: sara
            description: ''
            category: photography
            type: character
            preview: https://example.com/sara-preview.jpg
            training:
              status: completed
              defaultScale: 1
              quality: null
  responses:
    401-unauthorized:
      content:
        application/json:
          examples:
            invalid_api_key:
              summary: API key is not valid
              value:
                message: Invalid API key
            missing_api_key:
              summary: API key is not provided
              value:
                message: Missing API key
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Unauthorized - The client must authenticate itself to get the requested response.
    503-service-unavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_3'
      description: Service Unavailable
    400-bad-request:
      content:
        application/json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Parameter 'page' must be greater than 0
            invalid_query:
              summary: Parameter 'query' is not valid
              value:
                message: Parameter 'query' must not be empty
            invalid_filter:
              summary: Parameter 'filter' is not valid
              value:
                message: Parameter 'filter' is not valid
            generic_bad_request:
              summary: Bad Request
              value:
                message: Parameter ':attribute' is not valid
          schema:
            $ref: '#/components/schemas/inline_object'
        application/problem+json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Validation error
                invalid_params:
                - field: page
                  reason: Parameter 'page' must be greater than 0
                - field: per_page
                  reason: Parameter 'per_page' must be greater than 0
          schema:
            $ref: '#/components/schemas/inline_object_1'
      description: Bad Request - The server could not understand the request due to invalid syntax.
    500-internal-server-error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_2'
      description: Internal Server Error - The server has encountered a situation it doesn't know how to handle.
