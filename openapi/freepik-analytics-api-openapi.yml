openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Analytics API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: Analytics
paths:
  /v1/analytics/team-members:
    get:
      description: 'Returns all members of the caller''s team with their email, role, and status.


        Authenticates via API key (`X-Magnific-API-Key` header). The caller''s team

        is resolved automatically from the API key.'
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-analytics-team-members'
              schema:
                $ref: '#/components/schemas/_v1_analytics_team_members_get_200_response'
          description: OK
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: List team members
      tags:
      - Analytics
      operationId: getV1AnalyticsTeamMembers
      x-operation-id-source: derived
  /v1/analytics/team-api-keys:
    get:
      description: 'Returns all API keys belonging to the caller''s team with their ID,

        display name, and status. Use the returned `api_key_id` values as filters

        in `POST /v1/analytics/team-credit-usage`.


        Authenticates via API key (`X-Magnific-API-Key` header). The caller''s team

        is resolved automatically from the API key.'
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-analytics-team-api-keys'
              schema:
                $ref: '#/components/schemas/_v1_analytics_team_api_keys_get_200_response'
          description: OK
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: List team API keys
      tags:
      - Analytics
      operationId: getV1AnalyticsTeamApiKeys
      x-operation-id-source: derived
  /v1/analytics/team-groups:
    get:
      description: 'Returns all groups within the caller''s team with their ID, name,

        and member count. Use the returned `group_id` values as filters in

        `POST /v1/analytics/team-credit-usage`.


        Authenticates via API key (`X-Magnific-API-Key` header). The caller''s team

        is resolved automatically from the API key.'
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-analytics-team-groups'
              schema:
                $ref: '#/components/schemas/_v1_analytics_team_groups_get_200_response'
          description: OK
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: List team groups
      tags:
      - Analytics
      operationId: getV1AnalyticsTeamGroups
      x-operation-id-source: derived
  /v1/analytics/team-projects:
    get:
      description: 'Returns all projects within the caller''s team with their

        reference UUID and name. Use the returned `project_reference` values

        in the `project_references` filter of `POST /v1/analytics/team-credit-usage`.


        Authenticates via API key (`X-Magnific-API-Key` header). The caller''s team

        is resolved automatically from the API key.'
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-analytics-team-projects'
              schema:
                $ref: '#/components/schemas/_v1_analytics_team_projects_get_200_response'
          description: OK
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: List team projects
      tags:
      - Analytics
      operationId: getV1AnalyticsTeamProjects
      x-operation-id-source: derived
  /v1/analytics/team-credit-usage:
    post:
      description: 'Returns credit consumption for the caller''s team aggregated into time buckets.

        Authenticates via API key (`X-Magnific-API-Key` header). The caller''s identity

        is resolved automatically from the API key.


        Response always includes per-user breakdown with email and per-project grouping

        (same data as the CSV export). Each row carries both the tool category as a

        display name in `tool` (e.g. "AI Image Models") and the specific tool that was

        billed in `tool_name`.


        Reconciling usage: many tools share a category, so `tool` alone does not identify

        a row. Rows with the same `tool`, user, project and date are distinct consumptions

        — tell them apart by `tool_name` and sum their credits. De-duplicating them

        undercounts real usage.


        Date range limits: Enterprise up to 365 days, Business up to 180 days.

        If no dates are provided, defaults to the last 7 days.


        Available exclusively for Business and Enterprise plans. Rate limit: 100 RPD.


        Response field mapping (differs from internal endpoints):

        - `tool`: tool category as a display name (e.g. "AI Image Models")

        - `tool_name`: the specific tool billed (e.g. "pikaso-tti-flux-dev")

        - `user_uses`: number of operations (replaces `count`)

        - `user_credits`: credits consumed (replaces `total_amount`/`amount`)

        - `project_reference`: project UUID (replaces `folder_reference`)'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_v1_analytics_team_credit_usage_post_request'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                example-team-credit-usage:
                  $ref: '#/components/examples/200-analytics-team-credit-usage'
              schema:
                $ref: '#/components/schemas/_v1_analytics_team_credit_usage_post_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Get team credit usage over time
      tags:
      - Analytics
      operationId: postV1AnalyticsTeamCreditUsage
      x-operation-id-source: derived
  /v1/analytics/audit-logs/events:
    get:
      description: 'Returns the audit-log events of the caller''s enterprise team: who did what,

        to which resource, and how access changed.


        Authenticates via API key (`X-Magnific-API-Key` header). The caller''s enterprise

        team and identity are resolved automatically from the API key.


        Available exclusively for Enterprise plans with audit logs enabled, and only to team

        **admins/owners**. Rate limit: 500 RPD.


        Retention & paging:

        - The audit index retains at most **30 days**; the query window cannot exceed 30

        days and defaults to the last 30 days when no dates are given.

        - `per_page` is capped at **100**. In page mode, `page * per_page` cannot exceed

        **10000** (`400` otherwise) — use `cursor` for deep iteration.

        - When `cursor` is provided, `page` is ignored and there is no depth limit. Follow

        `meta.next_cursor` until it is `null` to walk the whole history.


        Reading your own audit trail costs no credits.'
      parameters:
      - description: Page number (1-based). Ignored when `cursor` is set.
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Items per page (max 100).
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: Start of the query window (YYYY-MM-DD). Defaults to 30 days ago. Window max 30 days.
        in: query
        name: date_from
        required: false
        schema:
          example: 2026-07-16
          format: date
          type: string
      - description: End of the query window (YYYY-MM-DD). Defaults to today.
        in: query
        name: date_to
        required: false
        schema:
          example: 2026-07-31
          format: date
          type: string
      - description: 'Filter by actor user ID(s). Accepts a single value, a comma-separated list

          (`member_id=1,2`) or repeated params (`member_id[]=1&member_id[]=2`).

          '
        example:
        - 10499812
        explode: false
        in: query
        name: member_id
        required: false
        schema:
          items:
            minimum: 1
            type: integer
          type: array
        style: form
      - description: Filter by team group ID(s). Same multi-value syntax as `member_id`.
        example:
        - 10
        - 20
        explode: false
        in: query
        name: group_id
        required: false
        schema:
          items:
            minimum: 1
            type: integer
          type: array
        style: form
      - description: Filter by folder reference(s). Same multi-value syntax as `member_id`.
        example:
        - a1b2c3d4-1111-4000-8000-000000000001
        explode: false
        in: query
        name: folder_id
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Filter by event type(s). Same multi-value syntax as `member_id`.
        example:
        - team.member.role_changed
        explode: false
        in: query
        name: event_type
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: Exact `request_id` lookup — returns all events emitted by one request.
        example: req-7f3a9c1e
        in: query
        name: request_id
        required: false
        schema:
          type: string
      - description: 'Opaque cursor for deep iteration. When set, `page` is ignored and there is no

          depth limit. Take the value from `meta.next_cursor` of the previous response.

          '
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-analytics-audit-logs-events'
              schema:
                $ref: '#/components/schemas/_v1_analytics_audit_logs_events_get_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Search enterprise audit-log events
      tags:
      - Analytics
      operationId: getV1AnalyticsAuditLogsEvents
      x-operation-id-source: derived
