openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Videos API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: Videos
paths:
  /v1/videos:
    get:
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Search term. This filter is required whenever the author filter parameter is not in the request. In case you use it with some of these params, response will be error 400, Bad request. This is a temporary causality.
        example: nature
        in: query
        name: term
        required: true
        schema:
          type: string
      - description: Page number. It must be greater than 0.
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: 'Define order of results.

          '
        in: query
        name: order
        required: false
        schema:
          default: relevance
          enum:
          - relevance
          - recent
          - random
          type: string
      - description: Advanced filtering options for video
        explode: true
        in: query
        name: filters
        schema:
          $ref: '#/components/schemas/_v1_videos_get_filters_parameter'
        style: deepObject
      responses:
        '200':
          content:
            application/json:
              examples:
                all_elements_with_pagination:
                  $ref: '#/components/examples/200-b2b-videos-full-list-pagination'
              schema:
                $ref: '#/components/schemas/_v1_videos_get_200_response'
          description: OK
          headers:
            Content-Type:
              schema:
                example: application/json
                type: string
        '400':
          $ref: '#/components/responses/400-bad-request'
        '404':
          $ref: '#/components/responses/404-not-found-for-search'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Search and filter videos by specified order
      tags:
      - Videos
      operationId: getV1Videos
      x-operation-id-source: derived
  /v1/videos/{id}:
    get:
      parameters:
      - description: Video id
        example: 30955
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                detail:
                  $ref: '#/components/examples/200-b2b-get-video-detail'
              schema:
                $ref: '#/components/schemas/_v1_videos__id__get_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '404':
          $ref: '#/components/responses/404-not-found'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Get detailed video information by ID
      tags:
      - Videos
      operationId: getV1VideosById
      x-operation-id-source: derived
  /v1/videos/{id}/download:
    get:
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Video id
        example: 30955
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                response_download_200:
                  $ref: '#/components/examples/200-b2b-get-download-video-response'
              schema:
                $ref: '#/components/schemas/_v1_videos__id__download_get_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Download a video by ID
      tags:
      - Videos
      operationId: getV1VideosByIdDownload
      x-operation-id-source: derived
  /v1/videos/{id}/options/{option-id}/download:
    get:
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Video id
        example: 30955
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      - description: Video option id
        example: 12345
        in: path
        name: option-id
        required: true
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                response_download_200:
                  $ref: '#/components/examples/200-b2b-get-download-video-response'
              schema:
                $ref: '#/components/schemas/_v1_videos__id__download_get_200_response'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Download a video by option id
      tags:
      - Videos
      operationId: getV1VideosByIdOptionsByOptionIdDownload
      x-operation-id-source: derived
components:
  responses:
    401-unauthorized:
      content:
        application/json:
          examples:
            invalid_api_key:
              summary: API key is not valid
              value:
                message: Invalid API key
            missing_api_key:
              summary: API key is not provided
              value:
                message: Missing API key
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Unauthorized - The client must authenticate itself to get the requested response.
    403-forbidden:
      content:
        application/json:
          examples:
            user_not_authorized:
              summary: User has not privileges to access some resource
              value:
                message: User is not authorized to access this resource
            user_not_owner:
              summary: Collection author id is different from current user's id
              value:
                message: User is not owner of requested collection
            item_is_premium:
              summary: The user cannot download this item because it is premium
              value:
                message: The user cannot download this item because it is premium
            creator_not_authorized:
              summary: Creator has not privileges to access some resource
              value:
                message: Creator is not authorized to access this resource
            transaction_stats_access_denied:
              summary: Group admin is not allowed to access the requested transaction stats
              value:
                message: Access denied to transaction stats for the current role
            credit_filter_not_allowed:
              summary: Group admin tried to use a credit-usage filter dimension not allowed for their role
              value:
                message: Credit filter not allowed for the current role
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Forbidden - The client does not have permission to access the requested resource.
    404-not-found-for-search:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_5'
      description: Not Found
    503-service-unavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_3'
      description: Service Unavailable
    400-bad-request:
      content:
        application/json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Parameter 'page' must be greater than 0
            invalid_query:
              summary: Parameter 'query' is not valid
              value:
                message: Parameter 'query' must not be empty
            invalid_filter:
              summary: Parameter 'filter' is not valid
              value:
                message: Parameter 'filter' is not valid
            generic_bad_request:
              summary: Bad Request
              value:
                message: Parameter ':attribute' is not valid
          schema:
            $ref: '#/components/schemas/inline_object'
        application/problem+json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Validation error
                invalid_params:
                - field: page
                  reason: Parameter 'page' must be greater than 0
                - field: per_page
                  reason: Parameter 'per_page' must be greater than 0
          schema:
            $ref: '#/components/schemas/inline_object_1'
      description: Bad Request - The server could not understand the request due to invalid syntax.
    404-not-found:
      content:
        application/json:
          examples:
            ai_resource_not_found:
              summary: AI resource with provided id does not exist
              value:
                message: AI resource not found
            collection_not_found:
              summary: Collection with provided id does not exist
              value:
                message: Collection not found
            resource_not_found:
              summary: Resource with provided id does not exist
              value:
                message: Resource not found
            resources_not_found:
              summary: Resources not found
              value:
                message: Resources not found
            user_not_found:
              summary: User with provided id does not exist
              value:
                message: User not found
            video_not_found:
              summary: Video with provided id does not exist
              value:
                message: Video not found
            video_assets_not_found:
              summary: Video with provided id has not associated assets
              value:
                message: Video not found
            icon_not_found:
              summary: Icon with provided id does not exist
              value:
                message: Icon not found
            author_not_found:
              summary: Author with provided id does not exist
              value:
                message: Author not found
            developer_not_found:
              summary: Developer with provided email does not exist
              value:
                message: Developer not found
            country_not_found:
              summary: Country with provided code does not exist
              value:
                message: Country not found
            generic_not_found:
              summary: Not Found
              value:
                message: Not found
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Not Found - The server can not find the requested resource.
    500-internal-server-error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_2'
      description: Internal Server Error - The server has encountered a situation it doesn't know how to handle.
    429-too-many-requests:
      content:
        application/json:
          examples:
            generic:
              summary: Generic message for 429 errors
              value:
                message: Too many requests
            download_limit_reached:
              summary: The download limits has been reached.
              value:
                message: The user can't download more items because the download limits has been reached.
            edit_limit_reached:
              summary: Free user icon edit limits has been reached.
              value:
                message: Limit for free users reached.
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Too Many Requests - The client has sent too many requests in a given amount of time.
  schemas:
    author_video_metas:
      example:
        assets: 0
        downloads: 0
      properties:
        downloads:
          description: The number of downloads of this author.
          minimum: 0
          type: integer
        assets:
          description: The number of assets of this author.
          minimum: 0
          type: integer
      required:
      - assets
      - downloads
      type: object
    option:
      example:
        id: 76989
        active: true
        width: 4096
        height: 2304
        quality: 4k
        container: mp4
        codec: AVC Coding
        bit_rate: 25.44
        size: 400
        aspect_ratio: 969
        is_original: true
      properties:
        id:
          example: 76989
          minimum: 1
          type: integer
        active:
          example: true
          type: boolean
        width:
          description: The width of the original video.
          example: 4096
          minimum: 1
          type: integer
        height:
          example: 2304
          minimum: 1
          type: integer
        quality:
          $ref: '#/components/schemas/quality'
        container:
          example: mp4
          type: string
        codec:
          example: AVC Coding
          type: string
        bit_rate:
          example: 25.44
          maximum: 500000
          minimum: 1
          type: number
        size:
          example: 400
          maximum: 500000
          minimum: 1
          type: number
        aspect-ratio:
          $ref: '#/components/schemas/aspect-ratio_2'
        is_original:
          description: if it is the original file uploaded by the author without any post processing
          example: true
          type: boolean
      required:
      - aspect_ratio
      type: object
    inline_object_1_problem_invalid_params_inner:
      properties:
        name:
          description: Name of the invalid parameter.
          example: page
          type: string
        field:
          description: Field of the invalid parameter. Mirrors `name`.
          example: page
          type: string
        reason:
          example: Parameter 'page' must be greater than 0
          type: string
      required:
      - field
      - name
      - reason
      type: object
    _v1_videos_get_filters_parameter_license:
      properties:
        free:
          type: boolean
        premium:
          type: boolean
      type: object
    pagination:
      description: Metainformation about pagination
      example:
        per_page: 1
        total: 1
        last_page: 1
        current_page: 1
      properties:
        current_page:
          description: The current page.
          example: 1
          type: integer
        per_page:
          description: The limit of resources per page.
          example: 1
          type: integer
        last_page:
          description: The total number of pages.
          example: 1
          type: integer
        total:
          description: The total number of resources.
          example: 1
          type: integer
      type: object
    aspect-ratio_2:
      description: The aspect ratio of this item
      enum:
      - 243
      - 969
      - 256:135
      - 556
      - 61
      example: '969'
      type: string
    inline_object_1:
      properties:
        problem:
          $ref: '#/components/schemas/inline_object_1_problem'
      type: object
    search_item:
      allOf:
      - $ref: '#/components/schemas/base_item'
      - properties:
          premium:
            description: 1 if this video is premium. 0, otherwise.
            example: 1
            type: integer
          best_asset_for_ai:
            description: The id of the best asset for AI (mp4 with best resolution assets option-id).
            example: 3242324
            type: integer
        type: object
    tag_1:
      example:
        name: Merry Christmas
        slug: merry-christmas
      properties:
        slug:
          example: merry-christmas
          minLength: 1
          type: string
        name:
          description: The name of the tag.
          example: Merry Christmas
          minLength: 1
          type: string
      required:
      - name
      - slug
      type: object
    preview:
      description: Information needed to preview a resource.
      example:
        width: 300
        url: https://www.freepik.com/free-ai-image/surreal-landscape_41357833.htm
        height: 500
      properties:
        url:
          description: Resource's url.
          example: https://www.freepik.com/free-ai-image/surreal-landscape_41357833.htm
          format: uri
          type: string
        width:
          description: Resource image width.
          example: 300
          minimum: 0
          type: integer
        height:
          description: Resource image height.
          example: 500
          minimum: 0
          type: integer
      required:
      - height
      - url
      - width
      type: object
    _v1_videos_get_filters_parameter:
      properties:
        aspect_ratio:
          items:
            enum:
            - 61
            - 243
            - 556
            - 969
            - 256:135
            type: string
          type: array
        category:
          $ref: '#/components/schemas/schema_1'
        duration:
          $ref: '#/components/schemas/_v1_videos_get_filters_parameter_duration'
        orientation:
          items:
            enum:
            - horizontal
            - vertical
            - square
            - panoramic
            type: string
          type: array
          uniqueItems: true
        license:
          $ref: '#/components/schemas/_v1_videos_get_filters_parameter_license'
        resolution:
          $ref: '#/components/schemas/_v1_videos_get_filters_parameter_resolution'
        fps:
          items:
            enum:
            - '24'
            - '25'
            - '30'
            - '60'
            - gt60
            type: string
          type: array
        topic:
          items:
            enum:
            - people
            - nature
            - business
            - background
            - food
            - travel
            - sports
            - events
            type: string
          type: array
        ai-generated:
          $ref: '#/components/schemas/_v1_videos_get_filters_parameter_ai_generated'
        video-tool:
          $ref: '#/components/schemas/_v1_videos_get_filters_parameter_video_tool'
        ids:
          type: string
        author:
          minimum: 1
          type: integer
      type: object
    inline_object_1_problem:
      properties:
        message:
          example: Validation error
          type: string
        invalid_params:
          items:
            $ref: '#/components/schemas/inline_object_1_problem_invalid_params_inner'
          type: array
      required:
      - invalid_params
      - message
      type: object
    author-video:
      example:
        metas:
          assets: 0
          downloads: 0
        code: merry-christmas
        name: John Doe
        id: 2147483647
        avatar: https://avatar.cdnpk.net/61668527-220726032514.jpg
        slug: merry-christmas
      properties:
        id:
          maximum: 9223372036854775807
          minimum: 1
          type: integer
        name:
          example: John Doe
          minLength: 1
          type: string
        code:
          example: merry-christmas
          minLength: 1
          type: string
        avatar:
          example: https://avatar.cdnpk.net/61668527-220726032514.jpg
          format: uri
          type: string
        metas:
          $ref: '#/components/schemas/author_video_metas'
        slug:
          example: merry-christmas
          minLength: 1
          type: string
      required:
      - avatar
      - id
      - metas
      - name
      - slug
      type: object
    _v1_videos_get_filters_parameter_ai_generated:
      properties:
        excluded:
          example: true
          type: boolean
        only:
          example: true
          type: boolean
      type: object
    inline_object_2:
      example:
        message: Internal Server Error
      properties:
        message:
          example: Internal Server Error
          type: string
      type: object
    inline_object:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    quality:
      description: The quality of this video
      enum:
      - 720p
      - 1080p
      - 2k
      - 4k
      example: 4k
      type: string
    search_icons_200_response_meta:
      example:
        pagination:
          per_page: 1
          total: 1
          last_page: 1
          current_page: 1
      properties:
        pagination:
          $ref: '#/components/schemas/pagination'
      required:
      - pagination
      type: object
    inline_object_3:
      example:
        message: Service Unavailable. Please try again later.
      properties:
        message:
          example: Service Unavailable. Please try again later.
          type: string
      type: object
    _v1_videos_get_filters_parameter_resolution:
      properties:
        '720':
          type: boolean
        '1080':
          type: boolean
        2k:
          type: boolean
        4k:
          type: boolean
      type: object
    _v1_videos_get_filters_parameter_video_tool:
      properties:
        after-effects:
          example: true
          type: boolean
        premiere-pro:
          example: true
          type: boolean
        mogrt:
          example: true
          type: boolean
      type: object
    detail_b2b:
      example:
        aspect_ratio: '969'
        code: gorgeous-woman-stretching-neck
        created: 2000-01-23 04:56:07+00:00
        author:
          metas:
            assets: 0
            downloads: 0
          code: merry-christmas
          name: John Doe
          id: 2147483647
          avatar: https://avatar.cdnpk.net/61668527-220726032514.jpg
          slug: merry-christmas
        fps: '25'
        active: 1
        url: https://www.freepik.com/free-video/white-t-shirts-copy-space-gray-background_15667327
        quality: 4k
        tags:
        - name: Merry Christmas
          slug: merry-christmas
        - name: Merry Christmas
          slug: merry-christmas
        duration: 00:00:28
        explicit: 0
        premium: 0
        is_ai_generated: true
        item_subtype: footage
        name: gorgeous woman stretching neck
        previews:
        - url: https://v1.cdnpk.net/videvo_files/video/premium/video0289/watermarked/_Geometric80s30_FPpreview.mp4
          width: 100
          height: 100
          aspect_ratio: 969
        - url: https://v1.cdnpk.net/videvo_files/video/premium/video0289/watermarked/_Geometric80s30_FPpreview.mp4
          width: 100
          height: 100
          aspect_ratio: 969
        options:
        - id: 76989
          active: true
          width: 4096
          height: 2304
          quality: 4k
          container: mp4
          codec: AVC Coding
          bit_rate: 25.44
          size: 400
          aspect_ratio: 969
          is_original: true
        - id: 76989
          active: true
          width: 4096
          height: 2304
          quality: 4k
          container: mp4
          codec: AVC Coding
          bit_rate: 25.44
          size: 400
          aspect_ratio: 969
          is_original: true
        id: 99332243
        thumbnails:
        - url: https://img.freepik.com/free-photo/image_8353-7579.jpg
          width: 100
          height: 100
          aspect_ratio: 969
        - url: https://img.freepik.com/free-photo/image_8353-7579.jpg
          width: 100
          height: 100
          aspect_ratio: 969
      properties:
        id:
          description: schemas's id.
          example: 99332243
          minimum: 1
          type: integer
        url:
          description: Url to the video's detail page in magnific
          example: https://www.freepik.com/free-video/white-t-shirts-copy-space-gray-background_15667327
          format: uri
          type: string
        name:
          description: schemas's title.
          example: gorgeous woman stretching neck
          type: string
        created:
          description: The datetime when this video was created.
          format: date-time
          type: string
        code:
          example: gorgeous-woman-stretching-neck
          type: string
        quality:
          $ref: '#/components/schemas/quality'
        premium:
          description: 1 if this video is premium. 0, otherwise.
          example: 0
          type: integer
        duration:
          example: 00:00:28
          pattern: ^0[0-9]:[0-5][0-9]:[0-5][0-9]$
          type: string
        fps:
          description: The fps of this video
          enum:
          - '24'
          - '25'
          - '30'
          - '50'
          - '60'
          - gt60
          example: '25'
          type: string
        active:
          description: 1 if this video is active. 0, otherwise.
          example: 1
          type: integer
        explicit:
          enum:
          - 0
          - 1
          example: 0
          type: integer
        author:
          $ref: '#/components/schemas/author-video'
        thumbnails:
          items:
            $ref: '#/components/schemas/image-with-aspect-ratio'
          minItems: 1
          type: array
