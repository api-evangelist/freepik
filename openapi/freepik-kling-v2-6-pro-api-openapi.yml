      summary: Kling 2.6 Pro - Create video from text or image
      tags:
      - kling-v2-6-pro
components:
  schemas:
    inline_object:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    kling-request-v26-text-to-video:
      properties:
        webhook_url:
          description: Webhook URL to notify the user when the task is completed
          format: uri
          type: string
        prompt:
          description: Text prompt describing the desired video to generate, cannot exceed 2500 characters
          maxLength: 2500
          type: string
        negative_prompt:
          description: Text prompt describing what to avoid in the generated video, cannot exceed 2500 characters
          maxLength: 2500
          type: string
        cfg_scale:
          default: 0.5
          description: Flexibility in generation; The higher the value, the lower the model's degree of flexibility, and the stronger the relevance to the user's prompt.
          format: float
          maximum: 1
          minimum: 0
          type: number
        aspect_ratio:
          $ref: '#/components/schemas/kling-v26-aspect-ratio'
        duration:
          description: Duration of the generated video in seconds
          enum:
          - '5'
          - '10'
          type: string
        generate_audio:
          description: Whether to generate audio for the video
          type: boolean
      required:
      - duration
      - prompt
      type: object
    postAiImageToVideoKlingV26Pro_request:
      anyOf:
      - $ref: '#/components/schemas/kling-request-v26-text-to-video'
