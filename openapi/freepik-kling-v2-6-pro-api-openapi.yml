          - COMPLETED
          - FAILED
          type: string
      required:
      - status
      - task_id
      type: object
    kling-request-v26-image-to-video:
      properties:
        webhook_url:
          description: Webhook URL to notify the user when the task is completed
          format: uri
          type: string
        image:
          description: Reference Image. Supports Base64 encoding or URL (ensure accessibility). For URL, must be publicly accessible. The image file size cannot exceed 10MB, and the resolution should not be less than 300x300px. Aspect ratio should be between 1:2.5 ~ 2.5:1.
          format: byte
          type: string
        prompt:
          description: Text prompt describing the desired motion in the video, cannot exceed 2500 characters
          maxLength: 2500
          type: string
        negative_prompt:
          description: Text prompt describing what to avoid in the generated video, cannot exceed 2500 characters
          maxLength: 2500
          type: string
        cfg_scale:
          default: 0.5
          description: Flexibility in generation; The higher the value, the lower the model's degree of flexibility, and the stronger the relevance to the user's prompt.
          format: float
          maximum: 1
          minimum: 0
          type: number
        aspect_ratio:
