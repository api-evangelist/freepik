components:
  schemas:
    itvseedance-pro-720p-request-content:
      allOf:
      - $ref: '#/components/schemas/seedance-base'
      title: Image to Video - Seedance Pro 720p
    task:
      example:
        task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: CREATED
      properties:
        task_id:
          description: Task identifier
          format: uuid
          type: string
        status:
          description: Task status
          enum:
          - CREATED
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          type: string
      required:
      - status
      - task_id
      type: object
    i2v-wan-25-720p-request-content:
      allOf:
      - $ref: '#/components/schemas/wan-25-i2v-base'
      description: Generate 720p video from image using WAN 2.5 model
      title: Image to Video - WAN 2.5 720p
    ttvminimax23-768p-request-content:
      allOf:
      - $ref: '#/components/schemas/minimax-hailuo-23-base'
      - properties:
          duration:
            default: 6
            description: Video length in seconds
            enum:
            - 6
            - 10
            example: 6
            type: integer
        type: object
      title: Text to Video
    runway-gen4-turbo-request:
      properties:
        webhook_url:
          description: Webhook URL to notify the user when the task is completed
          format: uri
          type: string
        image:
          description: Reference image. Supports Base64 encoding or HTTPS URL (must be publicly accessible).
          example: https://example.com/image.jpg
          type: string
        ratio:
          $ref: '#/components/schemas/runway-aspect-ratio'
        duration:
          default: 10
          description: Duration of the generated video in seconds
          enum:
          - 5
          - 10
          type: integer
        prompt:
          description: Text prompt describing what should appear in the video (1-1000 characters)
          maxLength: 1000
          type: string
        seed:
          description: Random seed for reproducibility
          maximum: 4294967295
          minimum: 0
          type: integer
      required:
      - image
      type: object
    create_video_minimax_hailuo_23_768p_fast_request:
      oneOf:
      - $ref: '#/components/schemas/itvminimax23-768p-fast-request-content'
      - $ref: '#/components/schemas/ttvminimax23-768p-fast-request-content'
    itvwan-v22-720p-request-content:
      allOf:
      - $ref: '#/components/schemas/wan-v22-base'
      title: Image to Video - Wan v2.2 720p
    ttvminimax-1080p-request-content:
      allOf:
      - $ref: '#/components/schemas/minimax-hailuo-02-base'
      - properties:
          duration:
            default: 6
            description: Video length in seconds (1080P only supports 6 seconds)
            enum:
            - 6
            example: 6
            type: integer
        type: object
      title: Text to Video
    inline_object_1:
      properties:
        problem:
          $ref: '#/components/schemas/inline_object_1_problem'
      type: object
    i2v-wan-25-480p-request-content:
      allOf:
      - $ref: '#/components/schemas/wan-25-i2v-base'
      description: Generate 480p video from image using WAN 2.5 model
      title: Image to Video - WAN 2.5 480p
    request_6:
      properties:
        prompt:
          description: Prompt describing the video to generate.
          type: string
        image_url:
          description: URL of the image to use as the first frame.
          format: uri
          type: string
        last_frame_image:
          description: 'Optional URL of the image to use as the last frame. When provided,

            PixVerse-V6 generates a transition between `image_url` (first frame)

            and `last_frame_image` (last frame) within the same endpoint.

            '
          format: uri
          type: string
        resolution:
          $ref: '#/components/schemas/resolution_4'
        aspect_ratio:
          $ref: '#/components/schemas/aspect-ratio_3'
        duration:
          default: 5
          description: 'Duration of the generated video in seconds. PixVerse-V6 accepts any

            integer value from `1` to `15` (PixVerse-V5.5 only accepted `5`, `8`

            or `10`).

            '
          maximum: 15
          minimum: 1
          type: integer
        negative_prompt:
          default: ''
          description: Negative prompt to be used for the generation.
          type: string
        style:
          $ref: '#/components/schemas/style-enum'
        seed:
          description: The same seed and the same prompt given to the same version of the model will output the same video every time.
          type: integer
        camera_movement:
          $ref: '#/components/schemas/camera-movement'
        generate_audio_switch:
          default: false
          description: When set to `true`, PixVerse-V6 generates synchronized audio (background music, sound effects, or dialogue) together with the video.
          type: boolean
        generate_multi_clip_switch:
          default: false
          description: When set to `true`, PixVerse-V6 produces multi-clip output with dynamic camera changes within a single generation.
          type: boolean
        thinking_type:
          $ref: '#/components/schemas/thinking-type'
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications whenever the task changes status. The payload sent to this URL is the same as the corresponding GET endpoint response, but without the data field.

            '
          example: https://www.example.com/webhook
          format: uri
          type: string
      required:
      - image_url
      - prompt
      type: object
    inline_object_3:
      example:
        message: Service Unavailable. Please try again later.
      properties:
        message:
          example: Service Unavailable. Please try again later.
          type: string
      type: object
    create_video_minimax_hailuo_02_1080p_request:
      oneOf:
      - $ref: '#/components/schemas/itvminimax-1080p-request-content'
      - $ref: '#/components/schemas/ttvminimax-1080p-request-content'
    itvminimax-1080p-request-content:
      allOf:
      - $ref: '#/components/schemas/minimax-hailuo-02-base'
      - properties:
          first_frame_image:
            description: 'The model will use the image passed in this parameter as the first frame to generate a video. Supported formats: URL of the image or base64 encoding of the image. Image specifications: format must be JPG, JPEG, or PNG; aspect ratio should be greater than 2:5 and less than 5:2; the shorter side must exceed 300 pixels; file size must not exceed 20MB.'
            example: https://img.freepik.com/free-photo/beautiful-sunset-over-mountains_123456-7890.jpg
            type: string
          last_frame_image:
            description: 'The model will use the image passed in this parameter as the last frame to generate a video. Supported formats: URL of the image or base64 encoding of the image. Image specifications: format must be JPG, JPEG, or PNG; aspect ratio should be greater than 2:5 and less than 5:2; the shorter side must exceed 300 pixels; file size must not exceed 20MB.'
            example: https://img.freepik.com/free-photo/beautiful-sunset-over-mountains_123456-7890.jpg
            type: string
          duration:
            default: 6
            description: Video length in seconds (1080P only supports 6 seconds)
            enum:
            - 6
            example: 6
            type: integer
        required:
        - first_frame_image
        type: object
      title: Image to Video
    ltx-2-fast-duration:
      default: 6
      description: 'Video duration in seconds. Fast model supports 6-20 seconds in 2-second increments.

        **Note:** Durations longer than 10 seconds require 25 FPS and 1080p resolution.

        '
      enum:
      - 6
      - 8
      - 10
      - 12
      - 14
      - 16
      - 18
      - 20
      example: 6
      type: integer
    aspect-ratio_5:
      default: 1280:720
