openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Cloned Voices API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: cloned-voices
paths:
  /v1/cloned-voices:
    get:
      description: 'Retrieve all cloned voices belonging to the authenticated user.


        Returns completed cloned voices created via the ElevenLabs voice cloning feature.

        Each voice includes metadata such as name, gender, language, provider, and preview audio URL.


        **Enterprise only** — this endpoint is available exclusively for Enterprise API key plans.'
      operationId: list_cloned_voices
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - id: 42
                  name: My Custom Voice
                  description: A warm, professional tone
                  preview_image_url: null
                  example_mp3_url: https://example.com/sample.mp3
                  gender: female
                  accent_id: null
                  provider: elevenlabs
                  eleven_labs_voice: pNInz6obpgDQGcFmaJgB
                  main_languages:
                  - id: 1
                    identifier: en
                    name: English
                  is_cloned: true
                  is_active: true
                  status: completed
                  last_used_at: 2026-06-01 10:30:00+00:00
                  deleted_at: null
              schema:
                $ref: '#/components/schemas/list_cloned_voices_200_response'
          description: List of cloned voices
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Cloned Voices - List user's cloned voices
      tags:
      - cloned-voices
    post:
      description: 'Create a cloned voice from one or more audio samples, using the ElevenLabs

        voice cloning feature. It behaves and is billed exactly like the web flow:

        the same limit of 30 active voices, the same credit consumption and the

        same lifecycle.


        Audio samples are provided as **public https URLs** (1 to 5). Each URL is

        downloaded server-side; the combined downloaded size must not exceed 200 MB.


        Creation is asynchronous: the endpoint returns `202` with the new voice in

        `pending` status. Poll `GET /v1/cloned-voices` until the voice reaches

        `completed`.


        **Enterprise only** — this endpoint is available exclusively for Enterprise API key plans.'
      operationId: create_cloned_voice
      requestBody:
        content:
          application/json:
            example:
              name: My Custom Voice
              description: A warm, professional tone
              remove_background_noise: true
              audios:
              - https://example.com/sample1.mp3
              - https://example.com/sample2.mp3
            schema:
              $ref: '#/components/schemas/create_cloned_voice_request'
        required: true
      responses:
        '202':
          content:
            application/json:
              example:
                success: true
                data:
                  id: 42
                  sqid: a1b2c3
                  name: My Custom Voice
                  status: pending
              schema:
                $ref: '#/components/schemas/create_cloned_voice_202_response'
          description: Cloned voice creation accepted; processing asynchronously
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '422':
          $ref: '#/components/responses/422-unprocessable-entity'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Cloned Voices - Create a cloned voice
      tags:
      - cloned-voices
  /v1/cloned-voices/{voice_id}:
    delete:
      description: 'Delete a cloned voice belonging to the authenticated user. The voice is

        removed at the provider (ElevenLabs) first and then soft-deleted.


        `{voice_id}` is the **provider voice id** — the `eleven_labs_voice` value

        returned by `GET /v1/cloned-voices`, not the internal numeric `id`. A voice

        that does not exist or does not belong to the caller returns `404`.


        **Enterprise only** — this endpoint is available exclusively for Enterprise API key plans.'
      operationId: delete_cloned_voice
      parameters:
      - description: Provider voice id (the `eleven_labs_voice` from the list endpoint)
        in: path
        name: voice_id
        required: true
        schema:
          example: pNInz6obpgDQGcFmaJgB
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                success: true
              schema:
                $ref: '#/components/schemas/delete_cloned_voice_200_response'
          description: Cloned voice deleted
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Cloned Voices - Delete a cloned voice
      tags:
      - cloned-voices
