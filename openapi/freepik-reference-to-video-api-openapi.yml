openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Reference To Video API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: reference-to-video
paths:
  /v1/ai/reference-to-video/kling-v3-omni-pro:
    post:
      description: 'Generate AI video using Kling 3 Omni Pro with a reference video for motion and style guidance.


        **Video-to-video mode:** This endpoint requires a `video_url` parameter. Reference the video in your prompt using `@Video1`.


        **Features:**

        - Use a reference video (3-10s) to guide motion and style

        - Combine with an image for start frame control

        - High-quality pro output


        **Use case:** Create videos that follow motion patterns from a reference video while applying your creative prompt.


        **Duration:** 3-15 seconds

        **Quality:** Pro mode offers highest quality output.


        **Tip:** For text-to-video or image-to-video without a reference video, use the `/ai/video/kling-v3-omni-pro` endpoint instead.'
      operationId: postAiReferenceToVideoKlingV3OmniPro
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kling-v3-omni-video-reference-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task-detail-200-default-response'
          description: OK - Task created successfully
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Kling 3 Omni Pro - Video-to-video generation
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/kling-v3-omni-std:
    post:
      description: 'Generate AI video using Kling 3 Omni Standard with a reference video for motion and style guidance.


        **Video-to-video mode:** This endpoint requires a `video_url` parameter. Reference the video in your prompt using `@Video1`.


        **Features:**

        - Use a reference video (3-10s) to guide motion and style

        - Combine with an image for start frame control

        - Faster generation at slightly lower quality


        **Use case:** Create videos that follow motion patterns from a reference video while applying your creative prompt.


        **Duration:** 3-15 seconds

        **Quality:** Standard mode offers faster generation at slightly lower quality.


        **Tip:** For text-to-video or image-to-video without a reference video, use the `/ai/video/kling-v3-omni-std` endpoint instead.'
      operationId: postAiReferenceToVideoKlingV3OmniStd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/kling-v3-omni-video-reference-request'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/task-detail-200-default-response'
          description: OK - Task created successfully
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Kling 3 Omni Standard - Video-to-video generation
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/kling-v3-omni:
    get:
      description: Retrieve the list of all Kling 3 Omni reference-to-video tasks (both Pro and Standard) for the authenticated user.
      operationId: getAiReferenceToVideoKlingV3OmniTasks
      parameters:
      - description: Page number for pagination (1-indexed)
        in: query
        name: page
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: Number of items per page
        in: query
        name: page_size
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_all_style_transfer_tasks_200_response'
          description: OK - The list of Kling 3 Omni reference-to-video tasks is returned
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Kling 3 Omni Reference-to-Video - List tasks
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/kling-v3-omni/{task-id}:
    get:
      description: Retrieve the status and result of a specific Kling 3 Omni reference-to-video task (Pro or Standard) by its task ID.
      operationId: getAiReferenceToVideoKlingV3OmniTask
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_style_transfer_task_status_200_response'
          description: OK - The task exists and the status is returned
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Kling 3 Omni Reference-to-Video - Get task status
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/wan-2-7:
    get:
      description: Retrieve the list of all WAN 2.7 reference-to-video tasks for the authenticated user.
      operationId: get_all_wan_27_r2v_tasks
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: WAN 2.7 R2V - List tasks
      tags:
      - reference-to-video
    post:
      description: 'Generate a video featuring characters from reference images or videos using WAN 2.7. Maintains visual identity of referenced characters across the generated video.


        **How to use references:**

        - Provide character images via `image_urls` and/or character videos via `video_urls`

        - Combined total of image and video references must not exceed 5

        - Reference characters in the prompt as "Image 1", "Image 2", "Video 1", etc.

        - Optionally include `reference_voice` per character for voice-guided generation


        **Key features:**

        - 720P and 1080P resolution support

        - 5 aspect ratio options (or use `start_image_url` to set aspect ratio from an image)

        - Duration range: 2-10 seconds'
      operationId: create_video_wan_27_r2v
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/r2v-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: WAN 2.7 - Create video from reference characters
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/wan-2-7/{task-id}:
    get:
      description: Retrieve the status and result of a specific WAN 2.7 reference-to-video task by its ID.
      operationId: get_wan_27_r2v_task
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: WAN 2.7 R2V - Get task status
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/happy-horse-1:
    get:
      description: Retrieve the list of all Happy Horse 1.0 reference-to-video tasks for the authenticated user.
      operationId: get_all_happy_horse_1_r2v_tasks
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Happy Horse 1.0 R2V - List tasks
      tags:
      - reference-to-video
    post:
      description: 'Generate a high-quality AI video guided by 1 to 9 reference images that define characters, objects or scenes using Happy Horse 1.0, Alibaba''s reference-to-video model.


        **How to use references:**

        - Provide 1 to 9 reference images via `image_urls`

        - Reference each image in the prompt by its 1-based positional index (`character1`, `character2`, ...)

        - The order of `image_urls` matches the character index in the prompt


        **Key features:**

        - 720P and 1080P resolution support

        - 5 aspect ratio options

        - Duration range: 3-15 seconds

        - Optional bottom-right "Happy Horse" watermark

        - Prompt up to 5000 characters'
      operationId: create_video_happy_horse_1_r2v
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/r2v-request_1'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Happy Horse 1.0 - Create video from reference images
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/happy-horse-1/{task-id}:
    get:
      description: Retrieve the status and result of a specific Happy Horse 1.0 reference-to-video task by its ID.
      operationId: get_happy_horse_1_r2v_task
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Happy Horse 1.0 R2V - Get task status
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/happy-horse-1-1:
    get:
      description: Retrieve the list of all Happy Horse 1.1 reference-to-video tasks for the authenticated user.
      operationId: get_all_happy_horse_1_1_r2v_tasks
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Happy Horse 1.1 R2V - List tasks
      tags:
      - reference-to-video
    post:
      description: 'Generate a high-quality AI video guided by 1 to 9 reference images that define characters, objects or scenes using Happy Horse 1.1, Alibaba''s reference-to-video model.


        **How to use references:**

        - Provide 1 to 9 reference images via `image_urls`

        - Reference each image in the prompt by its 1-based positional index (`character1`, `character2`, ...)

        - The order of `image_urls` matches the character index in the prompt


        **Key features:**

        - 720P and 1080P resolution support

        - 9 aspect ratio options

        - Duration range: 3-15 seconds

        - Optional bottom-right "Happy Horse" watermark

        - Prompt up to 5000 characters'
      operationId: create_video_happy_horse_1_1_r2v
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/r2v-request_2'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Happy Horse 1.1 - Create video from reference images
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/happy-horse-1-1/{task-id}:
    get:
      description: Retrieve the status and result of a specific Happy Horse 1.1 reference-to-video task by its ID.
      operationId: get_happy_horse_1_1_r2v_task
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
