        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Happy Horse 1.1 R2V - Get task status
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/veo-3-1:
    get:
      description: Retrieve a list of all reference-to-video generation tasks for Veo 3.1.
      operationId: get_all_veo_31_ref2v_tasks
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get all Veo 3.1 Reference-to-Video tasks
      tags:
      - reference-to-video
    post:
      description: Generate a video with character or object consistency using reference images. Maintains visual identity across scenes for storytelling and multi-scene projects. Supports 720p, 1080p, and 4K resolutions with native audio generation including dialogue and sound effects. Fixed 8-second duration at 24 FPS.
      operationId: create_video_veo_31_ref2v
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ref2v-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
