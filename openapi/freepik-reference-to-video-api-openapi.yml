        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Create video with reference images - Veo 3.1
      tags:
      - reference-to-video
  /v1/ai/reference-to-video/veo-3-1/{task-id}:
    get:
      description: Retrieve the status and results of a specific reference-to-video generation task.
      operationId: get_veo_31_ref2v_task
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
