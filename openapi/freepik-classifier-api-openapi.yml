openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Classifier API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: classifier
paths:
  /v1/ai/classifier/image:
    post:
      description: Accepts an image file as input and analyzes it to determine the probability that the image was generated by artificial intelligence, providing a confidence score.
      operationId: detect_ai_image
      requestBody:
        content:
          application/json:
            examples:
              image-base64:
                $ref: '#/components/examples/request-classifier-image-base64'
              image-url:
                $ref: '#/components/examples/request-classifier-image-url'
            schema:
              $ref: '#/components/schemas/classifier-request'
      responses:
        '200':
          content:
            application/json:
              examples:
                success:
                  $ref: '#/components/examples/200-classifier'
              schema:
                $ref: '#/components/schemas/detect_ai_image_200_response'
          description: OK - The request has succeeded, and the image has been classified.
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Analyzes an image to determine its likelihood of being AI-generated
      tags:
      - classifier
components:
  schemas:
    inline_object:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    result-classification:
      example:
        probability: 0.9489172697067261
        class_name: not_ai
      properties:
        class_name:
          description: The type of classification
          enum:
          - not_ai
          - ai
          example: not_ai
          type: string
        probability:
          description: The probability of the classification
          example: 0.9489172697067261
          type: number
      type: object
    inline_object_3:
      example:
        message: Service Unavailable. Please try again later.
      properties:
        message:
          example: Service Unavailable. Please try again later.
          type: string
      type: object
    detect_ai_image_200_response:
      example:
        data:
        - probability: 0.9489172697067261
          class_name: not_ai
        - probability: 0.9489172697067261
          class_name: not_ai
      properties:
        data:
          items:
            $ref: '#/components/schemas/result-classification'
          type: array
      required:
      - data
      type: object
    inline_object_1_problem_invalid_params_inner:
      properties:
        name:
          description: Name of the invalid parameter.
          example: page
          type: string
        field:
          description: Field of the invalid parameter. Mirrors `name`.
          example: page
          type: string
        reason:
          example: Parameter 'page' must be greater than 0
          type: string
      required:
      - field
      - name
      - reason
      type: object
    inline_object_1:
      properties:
        problem:
          $ref: '#/components/schemas/inline_object_1_problem'
      type: object
    classifier_request_image:
      description: Base64-encoded image string or URL pointing to an image.
      oneOf:
      - description: Base64-encoded image string.
        format: byte
        type: string
      - description: URL pointing to an image.
        format: uri
        type: string
      - description: Binary encoded image string.
        format: binary
        type: string
    classifier-request:
      properties:
        image:
          $ref: '#/components/schemas/classifier_request_image'
      required:
      - image
      type: object
    inline_object_1_problem:
      properties:
        message:
          example: Validation error
          type: string
        invalid_params:
          items:
            $ref: '#/components/schemas/inline_object_1_problem_invalid_params_inner'
          type: array
      required:
      - invalid_params
      - message
      type: object
    inline_object_2:
      example:
        message: Internal Server Error
      properties:
        message:
          example: Internal Server Error
          type: string
      type: object
  examples:
    request-classifier-image-base64:
      summary: Request - Image Base 64
      value:
        image: ...
    200-classifier:
      summary: Response - Success
      value:
        data:
        - class_name: not_ai
          probability: 0.9489172697067261
        - class_name: ai
          probability: 0.051082730293273926
    request-classifier-image-url:
      summary: Request - Image url
      value:
        image: https://img.freepik.com/free-photo/travel-trekking-summer-landscape-mountains-green-grass-trees-blue-sky_146671-18447.jpg
  responses:
    401-unauthorized:
      content:
        application/json:
          examples:
            invalid_api_key:
              summary: API key is not valid
              value:
                message: Invalid API key
            missing_api_key:
              summary: API key is not provided
              value:
                message: Missing API key
          schema:
            $ref: '#/components/schemas/inline_object'
      description: Unauthorized - The client must authenticate itself to get the requested response.
    503-service-unavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_3'
      description: Service Unavailable
    500-internal-server-error:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/inline_object_2'
      description: Internal Server Error - The server has encountered a situation it doesn't know how to handle.
    400-bad-request:
      content:
        application/json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Parameter 'page' must be greater than 0
            invalid_query:
              summary: Parameter 'query' is not valid
              value:
                message: Parameter 'query' must not be empty
            invalid_filter:
              summary: Parameter 'filter' is not valid
              value:
                message: Parameter 'filter' is not valid
            generic_bad_request:
              summary: Bad Request
              value:
                message: Parameter ':attribute' is not valid
          schema:
            $ref: '#/components/schemas/inline_object'
        application/problem+json:
          examples:
            invalid_page:
              summary: Parameter 'page' is not valid
              value:
                message: Validation error
                invalid_params:
                - field: page
                  reason: Parameter 'page' must be greater than 0
                - field: per_page
                  reason: Parameter 'per_page' must be greater than 0
          schema:
            $ref: '#/components/schemas/inline_object_1'
      description: Bad Request - The server could not understand the request due to invalid syntax.
  securitySchemes:
    magnificApiKey:
      description: 'Your Magnific API key. Required for authentication. [Learn how to obtain an API key](https://docs.magnific.com/quickstart)

        '
      in: header
      name: x-magnific-api-key
      type: apiKey
