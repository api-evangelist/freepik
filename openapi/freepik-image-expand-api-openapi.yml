openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Image Expand API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: image-expand
paths:
  /v1/ai/image-expand/flux-pro:
    get:
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get the status of all image expand tasks
      tags:
      - image-expand
      operationId: getV1AiImageExpandFluxPro
      x-operation-id-source: derived
    post:
      description: 'This endpoint allows you to expand an image using the AI Flux Pro model. The image will be expanded based on the provided parameters.


        ### Input size


        The image you send must be **at least 256 pixels on each side** and **no

        larger than 20 megapixels** (`width * height <= 20,000,000`). Neither side

        is capped on its own and there is no aspect ratio restriction: a 30000x600

        image is accepted, while a 255x70500 one is rejected because one of its

        sides is below 256, even though it is only 18 megapixels.


        File size is irrelevant — what counts is the decoded pixel count, so a

        heavily compressed 60 megapixel photo is rejected just the same. An image

        outside these bounds is rejected with an error naming the rule it broke.


        Sending more than 20 megapixels buys you nothing anyway: the output is

        capped at roughly 1.6 megapixels regardless of how large the input was, so

        resize before uploading.


        ### Output size


        `left`, `right`, `top` and `bottom` describe the expansion you are asking for,

        but **this model does not guarantee that exact output size**. The requested

        canvas is `input_width + left + right` by `input_height + top + bottom`, and

        two rules are then applied to it:


        1. **Maximum output size of roughly 1.6 megapixels.** If the requested canvas

        is larger, the whole image is scaled down proportionally until it fits. The

        aspect ratio is preserved, so there is no single maximum width or height:

        the cap applies to the total pixel count. A 1200x400 image expanded by 400

        pixels on each edge asks for a 2000x1200 canvas and comes back as 1632x976.

        2. **Each side is rounded to the nearest multiple of 16.** A requested

        916x692 comes back as 912x688; a requested 936x712 comes back as 944x720.


        Both rules apply on every request, including small ones, so an output that

        matches your requested pixels exactly is the exception rather than the rule.


        Omitting an edge applies its default (512 left, 512 right, 256 top, 256

        bottom). Sending `0` leaves that edge unexpanded; sending `0` on all four

        edges returns a `400`, since there is nothing to expand.


        That said, **this is the expand endpoint that stays closest to the pixel

        values you request**: below the 1.6 megapixel cap, the rounding to 16 is the

        only deviation. Expanding an 896x672 image by 500 pixels on the top edge

        alone asks for 896x1172 and returns 896x1168. The other two expand endpoints

        diverge much further:

        `ideogram` always renders at about 1 megapixel and only preserves the aspect

        ratio, and `seedream-v4-5` scales any canvas below 3.7 megapixels up. If you

        need exact output dimensions, resize the result yourself after generation.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/image-expand-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Flux Pro - Expand image
      tags:
      - image-expand
      operationId: postV1AiImageExpandFluxPro
      x-operation-id-source: derived
  /v1/ai/image-expand/flux-pro/{task-id}:
    get:
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get the status of one image expand task
      tags:
      - image-expand
      operationId: getV1AiImageExpandFluxProByTaskId
      x-operation-id-source: derived
  /v1/ai/image-expand/ideogram:
    get:
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get the status of all image expand ideogram tasks
      tags:
      - image-expand
      operationId: getV1AiImageExpandIdeogram
      x-operation-id-source: derived
    post:
      description: 'This endpoint allows you to expand an image using the Ideogram AI model. The image will be expanded based on the provided pixel values for each side.

        If no prompt is provided, the model will auto-generate one based on the image content.


        ### Output size


        `left`, `right`, `top` and `bottom` define the **aspect ratio** of the result,

        not its pixel dimensions. The canvas is built as

        `input_width + left + right` by `input_height + top + bottom`, and the model

        then renders it at **approximately 1 megapixel**, picking the closest match

        from its own fixed list of supported resolutions (all multiples of 32). The

        pixel values you send are therefore not preserved:


        | Requested canvas | Actual output |

        | --- | --- |

        | 896x1172 | 832x1088 |

        | 1396x672 | 1472x704 |

        | 896x896 | 1024x1024 |

        | 4992x4768 | 1024x960 |


        As the last row shows, a very large expansion does not produce a larger image:

        it only changes the shape. If you need specific output dimensions, resize the

        result yourself after generation.


        `left`, `right`, `top` and `bottom` are all required. At least one of them

        must be greater than `0`, otherwise the request returns a `400`; the other

        three may be `0`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/image-expand-ideogram-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Ideogram - Expand image
      tags:
      - image-expand
      operationId: postV1AiImageExpandIdeogram
      x-operation-id-source: derived
  /v1/ai/image-expand/ideogram/{task-id}:
    get:
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get the status of one image expand ideogram task
      tags:
      - image-expand
      operationId: getV1AiImageExpandIdeogramByTaskId
      x-operation-id-source: derived
  /v1/ai/image-expand/seedream-v4-5:
    get:
      responses:
        '200':
          $ref: '#/components/responses/task-list-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get the status of all image expand seedream v4.5 tasks
      tags:
      - image-expand
      operationId: getV1AiImageExpandSeedreamV45
      x-operation-id-source: derived
    post:
      description: 'This endpoint allows you to expand an image using the Seedream V4.5 AI model. The image will be expanded based on the provided pixel values for each side.

        If no prompt is provided, the model will auto-generate one based on the image content.


        ### Output size


        The requested canvas is `input_width + left + right` by

        `input_height + top + bottom`, and this model constrains it in two ways:


        1. **Each side is rounded up to the next multiple of 16.**

        2. **The canvas must contain between 3,686,400 and 16,777,216 pixels.** A

        smaller canvas is scaled **up** to reach the lower bound, and a larger one

        is scaled down to the upper bound. Since the lower bound is close to 3.7

        megapixels, a small input with a small expansion is upscaled — a 896x672

        image expanded by 100px on each edge asks for a 1096x872 canvas and comes

        back at 2160x1728, close to twice the requested dimensions (measured).


        If you need the output to stay close to the pixel values you requested, use

        `POST /v1/ai/image-expand/flux-pro`, which only deviates by the rounding to 16

        while the result stays under 1.6 megapixels. For exact dimensions, resize the

        result yourself after generation.


        `left`, `right`, `top` and `bottom` are all required, and at least one of them

        must be greater than `0`.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/image-expand-seedream-v4-5-request'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Seedream V4.5 - Expand image
      tags:
      - image-expand
      operationId: postV1AiImageExpandSeedreamV45
      x-operation-id-source: derived
  /v1/ai/image-expand/seedream-v4-5/{task-id}:
    get:
      parameters:
      - description: ID of the task
        in: path
        name: task-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/task-detail-200-default-response'
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get the status of one image expand seedream v4.5 task
      tags:
      - image-expand
      operationId: getV1AiImageExpandSeedreamV45ByTaskId
      x-operation-id-source: derived
