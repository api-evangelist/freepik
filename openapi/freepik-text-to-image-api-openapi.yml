openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Text To Image API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: text-to-image
paths:
  /v1/ai/text-to-image:
    post:
      description: Convert descriptive text input into images using AI. This endpoint accepts a variety of parameters to customize the generated images.
      operationId: create_image_from_text_classic
      requestBody:
        content:
          application/json:
            examples:
              all-params:
                $ref: '#/components/examples/request-tti-all-params'
              required-params:
                $ref: '#/components/examples/request-tti-required-params'
              portrait-image-size:
                $ref: '#/components/examples/request-tti-portrait-image-size'
              styling-params:
                $ref: '#/components/examples/request-tti-styling-params'
            schema:
              $ref: '#/components/schemas/request-content'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create_image_from_text_classic_200_response'
          description: OK - The request has succeeded, and the images generated from the text are returned.
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Create image from text - Classic fast
      tags:
      - text-to-image
  /v1/ai/text-to-image/flux-dev:
