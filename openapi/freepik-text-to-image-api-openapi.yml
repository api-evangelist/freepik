components:
  schemas:
    colors_palette_inner:
      properties:
        color:
          description: Hex color code
          example: '#FF0000'
          pattern: ^#[0-9A-F]{6}$
          type: string
        weight:
          description: Weight of the color (0.05 to 1)
          example: 0.5
          maximum: 1
          minimum: 0.05
          type: number
      required:
      - color
      - weight
      type: object
    tti-ideogram-4-5-request:
      properties:
        prompt:
          description: 'Text description of the image to generate, or of the edit to apply. When

            `images` are sent, refer to them by position: "image 1" is the first one

            (the image being edited) and "image 2" onwards are the references.

            '
          example: Turn image 1 into a vintage travel poster with the text "Ideogram 4.5" in bold art deco letters
          maxLength: 10000
          minLength: 1
          type: string
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications whenever the task changes status. The payload sent to this URL is the same as the corresponding GET endpoint response, but without the data field.

            '
          example: https://www.example.com/webhook
          format: uri
          type: string
        images:
          description: 'Optional input images. Without them the request is text-to-image. With

            them, the first image is the one being edited and the rest guide the

            edit as references.


            **Image requirements:**

            - Maximum 5 images

            - Supported formats: PNG, JPEG, WebP

            - Aspect ratio between 1:6 and 6:1

            - Public HTTPS URL or base64-encoded string

            '
          example:
          - https://example.com/source.png
          items:
            example: https://example.com/source.png
            type: string
          maxItems: 5
          minItems: 1
          type: array
        aspect_ratio:
          default: auto
          description: "Aspect ratio for the generated image, on a canvas of about 4 megapixels.\n\n**Available ratios:**\n- `auto`: Let the model choose (default). With `images` it follows the\n  first image; without them it picks the canvas that best fits the prompt.\n- `1:1`: Square, 2048x2048\n- `4:5`, `5:4`: Photo print\n- `3:4`, `4:3`: Standard\n- `2:3`, `3:2`: Classic photo\n- `9:16`, `16:9`: Social stories/Widescreen\n- `1:2`, `2:1`, `1:3`, `3:1`: Banners and vertical panels\n"
          enum:
          - auto
          - 61
          - 245
          - 304
          - 184
          - 243
          - 123
          - 182
          - 556
          - 969
          - 62
          - 121
          - 63
          - 181
          example: auto
          type: string
        quality:
          default: medium
          description: "Quality tier. It sets the price of the generation.\n\n**Available tiers:**\n- `very_low`: Cheapest and fastest. Only available when `images` are sent\n  (editing); a text-only request with it is rejected.\n- `low`\n- `medium`: Default\n- `high`: Best quality, slowest\n"
          enum:
          - very_low
          - low
          - medium
          - high
          example: medium
          type: string
        magic_prompt:
          default: auto
          description: 'Whether Ideogram''s Magic Prompt rewrites the prompt into a more detailed

            one before generating. `auto` lets the model decide; use `off` for

            verbatim edit instructions. It does not affect the price.

            '
          enum:
          - auto
          - 'on'
          - 'off'
          example: auto
          type: string
        seed:
          description: Seed for reproducible results. When omitted, a random seed is used.
          example: 42
          maximum: 2147483647
          minimum: 0
          type: integer
      required:
      - prompt
      title: Ideogram 4.5 Text-to-Image Request
      type: object
    ttisdv5p-edit-request-content:
      allOf:
      - $ref: '#/components/schemas/ttisdv5p-request-content'
      - properties:
          reference_images:
            description: 'Array of reference images for image editing (1 to 10 images).

              Seedream 5.0 Pro preserves subject details, lighting, and color tone when editing.


              **Supported formats:**

              - Base64-encoded image strings

              - Publicly accessible image URLs


              **Image requirements:**

              - Minimum resolution: 256x256 pixels

              - Maximum file size: 10MB per image

              - Supported formats: JPG, JPEG, PNG

              '
            example:
            - https://example.com/reference-image-1.jpg
            - https://example.com/reference-image-2.jpg
            items:
              description: Image as Base64 encoded string or publicly accessible URL
              type: string
            maxItems: 10
            minItems: 1
            type: array
        required:
        - reference_images
        type: object
    task:
      example:
        task_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        status: CREATED
      properties:
        task_id:
          description: Task identifier
          format: uuid
          type: string
        status:
          description: Task status
          enum:
          - CREATED
          - IN_PROGRESS
          - COMPLETED
          - FAILED
          type: string
      required:
      - status
      - task_id
      type: object
    ttigi25-edit-request-content:
      properties:
        prompt:
          description: 'Text instruction describing the edit to apply to the reference images.


            **Tips:**

            - Say what should change, not what the image already contains

            - Several references are used together as one visual context

            - Text inside the image can be corrected or replaced verbatim


            **Examples:**

            - Simple: "Put the product on a marble surface"

            - Detailed: "Replace the background with a sunlit studio, keep the product and its shadow, change the label text to ORGANIC"

            '
          example: Put the product on a marble surface
          maxLength: 32000
          minLength: 1
          type: string
        reference_images:
          description: 'The images to edit, in order. GPT Image 2.5 uses them together as the

            visual context for the prompt: it can restyle one image, or compose a

            new image from several.


            With the default `aspect_ratio: auto`, the output keeps the aspect

            ratio of these images.


            Each image may be up to 20 MiB, and one request may carry up to

            64 MiB of images in total.

            '
          items:
            description: 'Image URL (must be publicly reachable over HTTPS), a base64-encoded

              image, or an upload id returned by the uploads API.

              Supported formats: jpg, jpeg, png, webp.

              '
            example: https://example.com/product.jpg
            type: string
          maxItems: 16
          minItems: 1
          type: array
        webhook_url:
          description: 'Optional callback URL that will receive asynchronous notifications whenever the task changes status. The payload sent to this URL is the same as the corresponding GET endpoint response, but without the data field.

            '
          example: https://www.example.com/webhook
          format: uri
          type: string
        num_images:
          default: 1
          description: 'How many images to generate for this prompt. **Each image is billed

            separately.**

            '
          example: 1
          maximum: 10
          minimum: 1
          type: integer
        variant:
          default: flare
          description: 'Which model of the GPT Image 2.5 line renders the request. Both share

            every other parameter, the quality scale and the price.

            - `flare`: optimised for latency (default)

            - `sunburst`: optimised for editing precision

            '
          enum:
          - flare
          - sunburst
          example: flare
          type: string
        resolution:
          default: 1k
          description: 'Resolution tier of the generated image. Combined with `aspect_ratio` it

