openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Creations API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: Creations
paths:
  /v1/creations/recent:
    get:
      description: Returns the most recent files (creations) belonging to the user identified by the API key, enriched with the metadata of the creation that produced each file. Results are paginated and ordered from newest to oldest.
      operationId: getRecentCreations
      parameters:
      - description: Results per page. It must be greater than 0.
        example: 100
        in: query
        name: per_page
        schema:
          type: integer
      - description: Page number. It must be greater than 0.
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Filter the creations by the tool that produced them.
        example: text-to-image
        in: query
        name: tool_name
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getRecentCreations_200_response'
          description: OK Response
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      security:
      - magnificApiKey: []
      summary: Get the user's most recent creations
      tags:
      - Creations
