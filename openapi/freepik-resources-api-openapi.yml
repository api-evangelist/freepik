          example: 1
          type: integer
        per_page:
          description: The limit of resources per page.
          example: 1
          type: integer
        last_page:
          description: The total number of pages.
          example: 1
          type: integer
        total:
          description: The total number of resources.
          example: 1
          type: integer
      type: object
    clean_search:
      description: If true, It has been ensured that the search does not return disabled resources.
      example: true
      type: boolean
    format:
      example:
        size: 100
        id: 1
      properties:
        id:
          description: The id of the format. Null if doesn't exist
          example: 1
          type:
          - integer
          - 'null'
        size:
          description: The size of the file in bytes.
          example: 100
          type: integer
