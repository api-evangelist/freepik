openapi: 3.2.0
info:
  description: The Magnific API is your gateway to a vast collection of high-quality digital resources for your applications and projects. As a leading platform, it offers a wide range of graphics, including vectors, photos, illustrations, icons, PSD templates, and more, all curated by talented designers from around the world.
  title: Magnific Resources API
  version: 1.0.0
servers:
- description: B2B API Production V1
  url: https://api.magnific.com
security:
- magnificApiKey: []
tags:
- name: Resources
paths:
  /v1/resources:
    get:
      description: Retrieve a list of resources based on various filter criteria such as orientation, content type, license, and more.
      operationId: search_resources
      parameters:
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: Page number. It must be greater than 0 and less than or equal to 100.
        example: 1
        in: query
        name: page
        required: false
        schema:
          type: integer
      - description: Limit results per page. It must be greater than 0.
        example: 100
        in: query
        name: limit
        required: false
        schema:
          type: integer
      - description: "Specifies the order in which search results are returned. The available options allow you to prioritize results based on different criteria:\n - `relevance`: Prioritizes results that are most relevant to the search query.\n - `recent`: Sorts results by the most recent updates.\n"
        example: recent
        in: query
        name: order
        required: false
        schema:
          default: relevance
          enum:
          - relevance
          - recent
          type: string
      - description: Search term. If only term comes, it is searched for term, if only slug comes, it is searched for slug and if both come, it is searched for slug
        example: nature
        in: query
        name: term
        required: false
        schema:
          type: string
      - description: Advanced filtering options for resources
        explode: true
        in: query
        name: filters
        schema:
          $ref: '#/components/schemas/search_resources_filters_parameter'
        style: deepObject
      responses:
        '200':
          content:
            application/json:
              examples:
                example:
                  $ref: '#/components/examples/200-b2b-full-list-pagination'
              schema:
                $ref: '#/components/schemas/search_resources_200_response'
          description: Ok Response
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Search and filter resources with advanced options
      tags:
      - Resources
  /v1/resources/{resource-id}:
    get:
      description: Retrieve the detailed information of a specific resource by its ID. This endpoint supports multiple resource types including PSD, vector, photo, and AI-generated content.
      operationId: get_resource_detail_by_id
      parameters:
      - description: Photo, video or PSD resource ID
        example: 30955
        in: path
        name: resource-id
        required: true
        schema:
          type: string
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                detail_photo:
                  $ref: '#/components/examples/200-detail-photo-b2b'
                detail_vector:
                  $ref: '#/components/examples/200-detail-vector-b2b'
                detail_psd:
                  $ref: '#/components/examples/200-detail-psd-b2b'
                detail_ai:
                  $ref: '#/components/examples/200-detail-ai-b2b'
              schema:
                $ref: '#/components/schemas/get_resource_detail_by_id_200_response'
          description: OK Response
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '404':
          $ref: '#/components/responses/404-not-found'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Get detailed resource information by ID
      tags:
      - Resources
  /v1/resources/{resource-id}/download:
    get:
      description: Download a specific resource by providing the resource ID. This endpoint supports downloading various types of resources including vectors, PSDs, photos, and AI-generated content.
      operationId: download_resource_by_id
      parameters:
      - description: Photo, video or PSD resource ID
        example: 30955
        in: path
        name: resource-id
        required: true
        schema:
          type: integer
      - description: 'Specifies the search query language using the ISO 639-1 (2-letter

          language code) and the ISO 3166-1 (2-letter country code) for language variants.

          The API will use "en-US" as a default language for processing if a code is not

          provided, or does not exist.

          '
        example: en-US
        in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - description: "Resizes the photo to a specified size while maintaining aspect ratio. Accepts a pixel value (100px to 2000px) or \nkeywords small(1000px), medium(1500px), large(2000px), original corresponding to standard website sizes.\nThe size depends on the image orientation, the longest side of the image will be resized to the specified size.\nIf not specified, the highest resolution is provided. Applicable only to photos.\n"
        example: 2000px
        in: query
        name: image_size
        required: false
        schema:
          $ref: '#/components/schemas/download_resource_by_id_image_size_parameter'
      responses:
        '200':
          content:
            application/json:
              examples:
                download_vector_or_psd:
                  $ref: '#/components/examples/200-download-vector-or-psd'
                download_photo:
                  $ref: '#/components/examples/200-download-photo'
                download_ai:
                  $ref: '#/components/examples/200-download-ai-resource'
              schema:
                $ref: '#/components/schemas/download_resource_by_id_200_response'
          description: OK Response
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
        '503':
          $ref: '#/components/responses/503-service-unavailable'
      summary: Download an resource
      tags:
      - Resources
  /v1/resources/{resource-id}/download/{resource-format}:
    get:
      description: Retrieve a resource by specifying both the resource ID and the format. This endpoint allows for precise downloading of resources in the desired format.
      operationId: get_resource_download_formats
      parameters:
      - description: Photo, video or PSD resource ID
        example: 30955
        in: path
        name: resource-id
        required: true
        schema:
          type: integer
      - description: Resource format
        in: path
        name: resource-format
        required: true
        schema:
          enum:
          - psd
          - ai
          - eps
          - atn
          - fonts
          - resources
          - png
          - jpg
          - 3d-render
          - svg
          - mockup
          example: svg
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/download_list'
          description: OK
        '400':
          $ref: '#/components/responses/400-bad-request'
        '401':
          $ref: '#/components/responses/401-unauthorized'
        '403':
          $ref: '#/components/responses/403-forbidden'
        '404':
          $ref: '#/components/responses/404-not-found'
        '429':
          $ref: '#/components/responses/429-too-many-requests'
        '500':
          $ref: '#/components/responses/500-internal-server-error'
      summary: Get available download formats for resource
      tags:
      - Resources
