          - watercolor
          - flat
          - cartoon
          - geometric
          - gradient
          - isometric
          - 3d
          - hand-drawn
          type: string
      type: object
    pagination:
      description: Metainformation about pagination
      example:
        per_page: 1
        total: 1
        last_page: 1
        current_page: 1
